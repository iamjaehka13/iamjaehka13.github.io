<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Policy와 Discriminator의 입력 텐서 비교</title>
  <desc id="desc">Hopper 물리 상태와 스킬 원핫 벡터가 정책과 판별기에 다르게 전달되는 구조</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141b2d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="760" rx="32" fill="url(#background)"/>
  <text x="700" y="76" text-anchor="middle" fill="#f8fafc" font-family="Inter, Pretendard, sans-serif" font-size="40" font-weight="700">같은 transition, 다른 network input</text>
  <text x="700" y="116" text-anchor="middle" fill="#94a3b8" font-family="Inter, Pretendard, sans-serif" font-size="22">Policy와 Critic은 skill을 알아야 하지만 Discriminator는 물리 상태만 봐야 한다</text>

  <g filter="url(#shadow)" font-family="Inter, Pretendard, sans-serif">
    <rect x="75" y="205" width="310" height="145" rx="22" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="230" y="257" text-anchor="middle" fill="#bae6fd" font-size="21">Hopper observation</text>
    <text x="230" y="304" text-anchor="middle" fill="#ffffff" font-size="29" font-weight="700">physical state s</text>
    <text x="230" y="334" text-anchor="middle" fill="#7dd3fc" font-size="18">11 dimensions</text>

    <rect x="75" y="450" width="310" height="145" rx="22" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="230" y="502" text-anchor="middle" fill="#c7d2fe" font-size="21">Categorical skill</text>
    <text x="230" y="549" text-anchor="middle" fill="#ffffff" font-size="29" font-weight="700">one_hot(z)</text>
    <text x="230" y="579" text-anchor="middle" fill="#a5b4fc" font-size="18">20 dimensions</text>

    <rect x="505" y="225" width="330" height="175" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="670" y="278" text-anchor="middle" fill="#bfdbfe" font-size="21">Concatenation</text>
    <rect x="555" y="308" width="150" height="48" rx="10" fill="#0369a1"/>
    <rect x="705" y="308" width="80" height="48" rx="10" fill="#4f46e5"/>
    <text x="630" y="339" text-anchor="middle" fill="#ffffff" font-size="19">state 11</text>
    <text x="745" y="339" text-anchor="middle" fill="#ffffff" font-size="19">z 20</text>
    <text x="670" y="383" text-anchor="middle" fill="#93c5fd" font-size="18">total 31 dimensions</text>

    <rect x="965" y="225" width="350" height="175" rx="22" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="1140" y="278" text-anchor="middle" fill="#a7f3d0" font-size="22">Policy / Q / Value</text>
    <text x="1140" y="327" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">skill-conditioned path</text>
    <text x="1140" y="365" text-anchor="middle" fill="#6ee7b7" font-size="18">π(a | s, z), Q(s, z, a), V(s, z)</text>

    <rect x="765" y="500" width="400" height="155" rx="22" fill="#4a044e" stroke="#e879f9" stroke-width="2"/>
    <text x="965" y="552" text-anchor="middle" fill="#f5d0fe" font-size="22">Discriminator q(z | s)</text>
    <text x="965" y="598" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">physical state only</text>
    <text x="965" y="631" text-anchor="middle" fill="#f0abfc" font-size="18">11 dimensions → 20 skill logits</text>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)">
    <path d="M385 277 H493"/>
    <path d="M385 522 H435 Q465 522 465 492 V370 Q465 340 493 340"/>
    <path d="M835 312 H953"/>
    <path d="M385 255 H430 Q450 255 450 235 V175 Q450 155 470 155 H965 Q995 155 995 185 V488"/>
  </g>

  <path d="M610 522 C650 485 700 475 747 525" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 10"/>
  <line x1="674" y1="488" x2="728" y2="542" stroke="#fb7185" stroke-width="7" stroke-linecap="round"/>
  <line x1="728" y1="488" x2="674" y2="542" stroke="#fb7185" stroke-width="7" stroke-linecap="round"/>
  <text x="600" y="685" fill="#fda4af" font-family="Inter, Pretendard, sans-serif" font-size="19">z를 직접 넣으면 label leakage: 행동을 바꾸지 않고도 정답을 맞힐 수 있다</text>
</svg>
