<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#f7f9fa"/>
  <text x="600" y="55" text-anchor="middle" fill="#1d2a33" font-family="Arial, sans-serif" font-size="30" font-weight="700">HER는 update rule이 아니라 replay data를 바꾼다</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="190" width="205" height="110" rx="8" fill="#d9f2f5" stroke="#47c5d5" stroke-width="2"/>
    <text x="158" y="232" text-anchor="middle" fill="#173f47" font-size="24" font-weight="700">Rollout</text>
    <text x="158" y="270" text-anchor="middle" fill="#34444d" font-size="21">pi(a|s,g)</text>
    <path d="M260 245h90" stroke="#667680" stroke-width="5"/>
    <path d="M350 245l-22-14m22 14-22 14" stroke="#667680" stroke-width="5"/>
    <rect x="350" y="150" width="240" height="190" rx="8" fill="#fff" stroke="#cad5dc" stroke-width="2"/>
    <text x="470" y="192" text-anchor="middle" fill="#34444d" font-size="24" font-weight="700">Goal relabel</text>
    <text x="470" y="235" text-anchor="middle" fill="#52626b" font-size="20">g -> g'</text>
    <text x="470" y="270" text-anchor="middle" fill="#52626b" font-size="20">r -> r(g')</text>
    <text x="470" y="305" text-anchor="middle" fill="#20704d" font-size="20">s, a, s' 유지</text>
    <path d="M590 245h90" stroke="#667680" stroke-width="5"/>
    <path d="M680 245l-22-14m22 14-22 14" stroke="#667680" stroke-width="5"/>
    <rect x="680" y="190" width="205" height="110" rx="8" fill="#ffe8b8" stroke="#f5b642" stroke-width="2"/>
    <text x="783" y="232" text-anchor="middle" fill="#62470e" font-size="24" font-weight="700">Replay buffer</text>
    <text x="783" y="270" text-anchor="middle" fill="#62470e" font-size="20">original + HER</text>
    <path d="M885 245h90" stroke="#667680" stroke-width="5"/>
    <path d="M975 245l-22-14m22 14-22 14" stroke="#667680" stroke-width="5"/>
    <rect x="975" y="175" width="180" height="140" rx="8" fill="#263641"/>
    <text x="1065" y="220" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Off-policy RL</text>
    <text x="1065" y="258" text-anchor="middle" fill="#d5eef1" font-size="20">DQN / DDPG</text>
    <text x="1065" y="290" text-anchor="middle" fill="#d5eef1" font-size="20">SAC 등</text>

    <rect x="170" y="415" width="860" height="105" rx="8" fill="#fff" stroke="#cad5dc" stroke-width="2"/>
    <text x="600" y="458" text-anchor="middle" fill="#34444d" font-size="24">Critic target와 actor loss의 형태는 base RL 알고리즘을 따른다.</text>
    <text x="600" y="495" text-anchor="middle" fill="#a24743" font-size="23" font-weight="700">PPO rollout에 goal만 바꾸어 바로 넣으면 on-policy ratio가 깨질 수 있다.</text>
  </g>
</svg>
