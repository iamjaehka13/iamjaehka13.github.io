  <g font-family="Arial, sans-serif">
    <text x="335" y="155" text-anchor="middle" fill="#2f6872" font-size="25" font-weight="700">Goal gL: 왼쪽</text>
    <text x="865" y="155" text-anchor="middle" fill="#a24743" font-size="25" font-weight="700">Goal gR: 오른쪽</text>
    <circle cx="335" cy="290" r="35" fill="#f5b642"/>
    <circle cx="865" cy="290" r="35" fill="#f5b642"/>
    <path d="M335 290h-165" stroke="#47c5d5" stroke-width="12" stroke-linecap="round"/>
    <path d="M170 290l28-22m-28 22 28 22" stroke="#47c5d5" stroke-width="12" stroke-linecap="round"/>
    <path d="M865 290h-165" stroke="#8e9aa2" stroke-width="12" stroke-linecap="round"/>
    <path d="M700 290l28-22m-28 22 28 22" stroke="#8e9aa2" stroke-width="12" stroke-linecap="round"/>
    <circle cx="145" cy="290" r="18" fill="#47c5d5"/>
    <circle cx="1055" cy="290" r="18" fill="#ef6f6c"/>
    <text x="335" y="375" text-anchor="middle" fill="#207782" font-size="27" font-weight="700">Q(s, left, gL) 높음</text>
    <text x="865" y="375" text-anchor="middle" fill="#6f7d85" font-size="27" font-weight="700">Q(s, left, gR) 낮음</text>
    <text x="600" y="492" text-anchor="middle" fill="#34444d" font-size="27">Q(s,a)만으로는 "무엇을 향해 좋은 행동인가"를 표현할 수 없다.</text>
    <text x="600" y="535" text-anchor="middle" fill="#173f47" font-size="30" font-weight="700">UVFA: Q(s,a,g)와 pi(a|s,g)</text>
