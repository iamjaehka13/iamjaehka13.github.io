<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gaitor unified gait representation</title>
  <desc id="desc">A continuous latent orbit connects trot, crawl, and pace coordination patterns.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="18" height="630" fill="#ec5b78"/>
  <text x="78" y="88" fill="#52627a" font-family="Arial, sans-serif" font-size="23">QUADRUPED REPRESENTATION LEARNING · CoRL 2024</text>
  <text x="76" y="194" fill="#111827" font-family="Arial, sans-serif" font-size="80" font-weight="700">Gaitor</text>
  <text x="78" y="254" fill="#334155" font-family="Arial, sans-serif" font-size="30">Unified Representation Across Gaits</text>
  <text x="78" y="333" fill="#111827" font-family="Arial, sans-serif" font-size="31" font-weight="700">trot · crawl · pace를</text>
  <text x="78" y="378" fill="#111827" font-family="Arial, sans-serif" font-size="31" font-weight="700">하나의 latent space로 연결하기</text>
  <rect x="78" y="438" width="488" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="108" y="479" fill="#ec5b78" font-family="Arial, sans-serif" font-size="23" font-weight="700">g</text>
  <text x="142" y="479" fill="#334155" font-family="Arial, sans-serif" font-size="23">leg coordination</text>
  <text x="108" y="517" fill="#14b8a6" font-family="Arial, sans-serif" font-size="23" font-weight="700">ϕ, R</text>
  <text x="172" y="517" fill="#334155" font-family="Arial, sans-serif" font-size="23">phase + swing geometry</text>

  <rect x="642" y="70" width="488" height="488" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="886" y="112" text-anchor="middle" fill="#52627a" font-family="Arial, sans-serif" font-size="21">INTERPRETABLE PLANNING MANIFOLD</text>
  <circle cx="886" cy="302" r="150" fill="#f8fafc" stroke="#dbe3ed" stroke-width="2"/>
  <path d="M886 152 A150 150 0 0 1 1016 377 L886 302 Z" fill="#ec5b78" opacity="0.30"/>
  <path d="M1016 377 A150 150 0 0 1 756 377 L886 302 Z" fill="#f6c85f" opacity="0.38"/>
  <path d="M756 377 A150 150 0 0 1 886 152 L886 302 Z" fill="#14b8a6" opacity="0.34"/>
  <ellipse cx="886" cy="302" rx="126" ry="88" fill="none" stroke="#111827" stroke-width="7"/>
  <line x1="886" y1="302" x2="980" y2="246" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="930" y="260" fill="#111827" font-family="Arial, sans-serif" font-size="22">R</text>
  <path d="M920 315 A48 48 0 0 1 908 269" fill="none" stroke="#52627a" stroke-width="3"/>
  <text x="927" y="300" fill="#52627a" font-family="Arial, sans-serif" font-size="21">ϕ</text>
  <text x="886" y="174" text-anchor="middle" fill="#9f1239" font-family="Arial, sans-serif" font-size="22" font-weight="700">trot · +1</text>
  <text x="1012" y="430" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="22" font-weight="700">crawl · 0</text>
  <text x="760" y="430" text-anchor="middle" fill="#115e59" font-family="Arial, sans-serif" font-size="22" font-weight="700">pace · −1</text>
  <text x="886" y="516" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="23">continuous gait blending</text>
</svg>
