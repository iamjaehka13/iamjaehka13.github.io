<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Matched Unitree Go2 DIAYN and DADS experiment tree</title>
  <desc id="desc">The robot, PPO learner, schedule, safety arms, skill counts, checkpoints, and evaluation stay fixed while only the unsupervised skill objective changes. The experiment then follows common training, feature and safety ablations, skill-count expansion, periodic composition, and matched scratch control branches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="dads" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, DejaVu Sans, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 20px Inter, DejaVu Sans, sans-serif; fill: #a8b7cc; }
      .formula { font: 700 25px Inter, DejaVu Sans, sans-serif; fill: #f8fafc; }
      .small { font: 500 17px Inter, DejaVu Sans, sans-serif; fill: #cbd5e1; }
      .card-title { font: 700 24px Inter, DejaVu Sans, sans-serif; fill: #f8fafc; }
      .card-text { font: 500 17px Inter, DejaVu Sans, sans-serif; fill: #cbd5e1; }
      .result { font: 700 18px Inter, DejaVu Sans, sans-serif; fill: #e2e8f0; }
      .pill { font: 700 15px Inter, DejaVu Sans, sans-serif; fill: #07111f; }
    </style>
  </defs>

  <rect width="1400" height="980" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">DIAYN → DADS, the same Go2 experiment tree</text>
  <text x="70" y="108" class="subtitle">Robot · PPO · schedule · safety · K · checkpoints · clean evaluation stay matched</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="580" height="118" rx="20" fill="#202b42" stroke="#64748b" stroke-width="2"/>
    <rect x="750" y="145" width="580" height="118" rx="20" fill="#102f3b" stroke="url(#dads)" stroke-width="3"/>
  </g>
  <text x="105" y="188" class="formula">DIAYN · q(z | f(s))</text>
  <text x="105" y="225" class="small">Separate skill-conditioned state visitation</text>
  <text x="785" y="188" class="formula">DADS · q(Δs | s, z)</text>
  <text x="785" y="225" class="small">Separate predictable state transitions</text>
  <path d="M650 204 H744" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="605" y="278" width="190" height="34" rx="17" fill="url(#dads)"/>
  <text x="700" y="301" text-anchor="middle" class="pill">ONLY THIS CHANGES</text>

  <path d="M700 316 V352" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="190" y="360" width="1020" height="108" rx="20" fill="#18243a" stroke="#334155" stroke-width="2"/>
  </g>
  <rect x="220" y="386" width="58" height="56" rx="15" fill="#38bdf8"/>
  <text x="249" y="423" text-anchor="middle" class="formula" fill="#07111f">A</text>
  <text x="308" y="400" class="card-title">Common K=6 source and time scaling</text>
  <text x="308" y="434" class="card-text">wiring 0→5 · gate 5→100 · common 100→500 · raw vs policy-dt-scaled intrinsic reward</text>

  <path d="M700 470 V506" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="190" y="514" width="1020" height="108" rx="20" fill="#18243a" stroke="#334155" stroke-width="2"/>
  </g>
  <rect x="220" y="540" width="58" height="56" rx="15" fill="#818cf8"/>
  <text x="249" y="577" text-anchor="middle" class="formula" fill="#07111f">B</text>
  <text x="308" y="554" class="card-title">Feature and safety ablations</text>
  <text x="308" y="588" class="card-text">3D pose → planar XY → 33D proprioception → 18D dynamics · height reward and constrained-cost arms</text>

  <path d="M700 624 V658" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M700 658 H360 V690" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M700 658 H1040 V690" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="700" width="590" height="160" rx="20" fill="#18243a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="740" y="700" width="590" height="160" rx="20" fill="#18243a" stroke="#22c55e" stroke-width="2"/>
  </g>
  <rect x="100" y="726" width="58" height="56" rx="15" fill="#f59e0b"/>
  <text x="129" y="763" text-anchor="middle" class="formula" fill="#07111f">C</text>
  <text x="188" y="742" class="card-title">Inherited K expansion</text>
  <text x="188" y="776" class="card-text">K=6 model 600 → K=10, 20, 30</text>
  <text x="188" y="806" class="card-text">50-iteration checkpoints · all-skill 20 s videos</text>
  <text x="188" y="836" class="result">Diagnostic: source diversity gate had already failed</text>

  <rect x="770" y="726" width="58" height="56" rx="15" fill="#22c55e"/>
  <text x="799" y="763" text-anchor="middle" class="formula" fill="#07111f">E</text>
  <text x="858" y="742" class="card-title">Matched scratch control</text>
  <text x="858" y="776" class="card-text">Shared model 0 per K · train 0→1000</text>
  <text x="858" y="806" class="card-text">height-only vs height+roll · K=10, 20, 30</text>
  <text x="858" y="836" class="result">K=30 treatment: 150/150 clean timeouts, 12 moving</text>

  <path d="M360 862 V898 H700" stroke="#64748b" stroke-width="3"/>
  <path d="M1040 862 V898 H700" stroke="#64748b" stroke-width="3"/>
  <path d="M700 898 V912" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="350" y="920" width="700" height="44" rx="18" fill="#0f2934" stroke="url(#dads)" stroke-width="2"/>
  </g>
  <text x="700" y="948" text-anchor="middle" class="result">D · Frozen K=30 composition · 870 ordered pairs · exact 1000-transition selector</text>
</svg>
