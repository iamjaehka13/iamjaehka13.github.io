<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Multiplicative Compositional Policies</title>
  <desc id="desc">Several motor primitive distributions overlap to produce one composite action distribution.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="18" height="630" fill="#ef6a5b"/>
  <text x="78" y="92" fill="#475569" font-family="Arial, sans-serif" font-size="24">ROBOT CONTROL · NEURIPS 2019</text>
  <text x="76" y="198" fill="#0f172a" font-family="Arial, sans-serif" font-size="84" font-weight="700">MCP</text>
  <text x="78" y="258" fill="#334155" font-family="Arial, sans-serif" font-size="31">Multiplicative Compositional Policies</text>
  <text x="78" y="334" fill="#0f172a" font-family="Arial, sans-serif" font-size="31" font-weight="700">여러 motor primitive를 곱해</text>
  <text x="78" y="378" fill="#0f172a" font-family="Arial, sans-serif" font-size="31" font-weight="700">하나의 행동으로 조합하기</text>
  <rect x="78" y="438" width="488" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="108" y="482" fill="#0f172a" font-family="Arial, sans-serif" font-size="25">OR: 하나를 선택</text>
  <text x="108" y="522" fill="#0f172a" font-family="Arial, sans-serif" font-size="25">AND: 공통으로 허용되는 action</text>

  <rect x="650" y="72" width="472" height="486" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="886" y="112" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="22">PRODUCT OF EXPERTS</text>

  <g opacity="0.88">
    <ellipse cx="768" cy="270" rx="96" ry="140" fill="#22c1c3"/>
    <ellipse cx="882" cy="270" rx="96" ry="140" fill="#f6c85f"/>
    <ellipse cx="996" cy="270" rx="96" ry="140" fill="#ef6a5b"/>
  </g>
  <ellipse cx="882" cy="270" rx="48" ry="104" fill="#0f172a" opacity="0.88"/>
  <text x="768" y="276" text-anchor="middle" fill="#083344" font-family="Arial, sans-serif" font-size="24" font-weight="700">π₁</text>
  <text x="882" y="276" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">∩</text>
  <text x="996" y="276" text-anchor="middle" fill="#4c0519" font-family="Arial, sans-serif" font-size="24" font-weight="700">π₃</text>

  <line x1="882" y1="420" x2="882" y2="470" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="748" y="480" width="268" height="58" rx="8" fill="#0f172a"/>
  <text x="882" y="517" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24">one composite action</text>
</svg>
