<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Constrained Skill Discovery preview</title>
  <desc id="desc">A continuous skill vector controls both locomotion direction and speed.</desc>
  <rect width="1200" height="630" fill="#101827"/>
  <rect x="0" y="0" width="18" height="630" fill="#31c48d"/>
  <text x="84" y="118" fill="#91a4bd" font-family="Arial, sans-serif" font-size="24">UNSUPERVISED ROBOT LEARNING</text>
  <text x="80" y="235" fill="#f8fafc" font-family="Arial, sans-serif" font-size="104" font-weight="700">CSD</text>
  <text x="84" y="300" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="34">Constrained Skill Discovery</text>
  <text x="84" y="372" fill="#f8fafc" font-family="Arial, sans-serif" font-size="29">방향뿐 아니라 이동 크기까지 맞추는 스킬 공간</text>
  <line x1="84" y1="432" x2="550" y2="432" stroke="#334155" stroke-width="2"/>
  <text x="84" y="477" fill="#91a4bd" font-family="Arial, sans-serif" font-size="22">LSD / METRA</text>
  <text x="265" y="477" fill="#f59e0b" font-family="Arial, sans-serif" font-size="22">maximize</text>
  <text x="84" y="518" fill="#91a4bd" font-family="Arial, sans-serif" font-size="22">CSD</text>
  <text x="265" y="518" fill="#31c48d" font-family="Arial, sans-serif" font-size="22">match direction + magnitude</text>

  <circle cx="882" cy="315" r="214" fill="#172235" stroke="#334155" stroke-width="2"/>
  <circle cx="882" cy="315" r="142" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="9 9"/>
  <circle cx="882" cy="315" r="72" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="9 9"/>
  <line x1="668" y1="315" x2="1096" y2="315" stroke="#334155" stroke-width="2"/>
  <line x1="882" y1="101" x2="882" y2="529" stroke="#334155" stroke-width="2"/>
  <circle cx="882" cy="315" r="9" fill="#f8fafc"/>

