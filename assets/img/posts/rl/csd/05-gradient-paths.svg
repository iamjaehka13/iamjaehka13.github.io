<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Separate encoder and PPO gradient paths</title>
  <desc id="desc">The encoder receives direct supervised gradients while the policy learns indirectly through reward and PPO.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="34" font-weight="700">하나의 오차, 서로 다른 두 학습 경로</text>

  <rect x="55" y="100" width="1090" height="115" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="95" y="145" fill="#64748b" font-family="Arial, sans-serif" font-size="20">rollout sample</text>
  <text x="95" y="183" fill="#172033" font-family="Arial, sans-serif" font-size="27">(s_t, z, a_t, s_{t+1})</text>
  <line x1="430" y1="158" x2="550" y2="158" stroke="#64748b" stroke-width="4"/>
  <polygon points="570,158 542,143 542,173" fill="#64748b"/>
  <rect x="570" y="120" width="245" height="76" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  <text x="692" y="151" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="22">shared error</text>
  <text x="692" y="181" text-anchor="middle" fill="#2563eb" font-family="Arial, sans-serif" font-size="22">e_t</text>

  <path d="M 692 196 L 692 245 L 300 245 L 300 285" fill="none" stroke="#16a34a" stroke-width="5"/>
  <polygon points="300,305 285,277 315,277" fill="#16a34a"/>
  <path d="M 692 196 L 692 245 L 900 245 L 900 285" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <polygon points="900,305 885,277 915,277" fill="#f59e0b"/>

  <rect x="80" y="305" width="440" height="250" rx="8" fill="#f0fdf7" stroke="#86efac" stroke-width="2"/>
  <text x="300" y="352" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="28" font-weight="700">Encoder φ update</text>
  <text x="300" y="396" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="23">Smooth L1(e_t)</text>
  <line x1="300" y1="415" x2="300" y2="470" stroke="#16a34a" stroke-width="5"/>
  <polygon points="300,492 285,464 315,464" fill="#16a34a"/>
  <text x="300" y="528" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="22">직접 backpropagation</text>

  <rect x="680" y="305" width="440" height="250" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="900" y="352" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="28" font-weight="700">Policy π update</text>
  <text x="900" y="395" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="23">e_t → intrinsic reward</text>
  <text x="900" y="434" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="23">reward → advantage</text>
  <text x="900" y="473" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="23">advantage → PPO</text>
  <text x="900" y="528" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="22">환경을 거친 간접 학습</text>

  <line x1="600" y1="285" x2="600" y2="580" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 8"/>
  <text x="600" y="615" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="20">PPO loss가 encoder로, encoder loss가 policy로 그대로 흐르는 구조가 아니다</text>
</svg>
