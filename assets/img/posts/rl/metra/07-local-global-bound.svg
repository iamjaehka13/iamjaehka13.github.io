<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Local constraints imply a global temporal bound</title><desc id="d">Triangle inequality combines one-step latent bounds along a path.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8b949e"/></marker></defs>
<rect width="1200" height="620" fill="#0d1117"/><style>text{font-family:Arial,sans-serif;letter-spacing:0}.h{font-size:28px;font-weight:700;fill:#f0f3f6}.t{font-size:20px;fill:#c9d1d9}.s{font-size:17px;fill:#8b949e}.m{font:19px monospace;fill:#f2cc60}</style>
<text x="40" y="55" class="h">Local adjacency is enough to bound every reachable path</text><text x="40" y="92" class="s">The latent endpoint distance cannot exceed the sum of the one-step edges.</text>
<g stroke="#39d0d8" stroke-width="4" fill="#161b22"><circle cx="100" cy="250" r="36"/><circle cx="300" cy="190" r="36"/><circle cx="500" cy="270" r="36"/><circle cx="700" cy="180" r="36"/><circle cx="900" cy="265" r="36"/><circle cx="1100" cy="205" r="36"/><path d="M135 240 264 201M334 204 466 255M534 255 666 196M734 196 866 249M934 255 1065 216" fill="none" marker-end="url(#a)"/></g>
<g class="t" text-anchor="middle"><text x="100" y="257">s0</text><text x="300" y="197">s1</text><text x="500" y="277">s2</text><text x="700" y="187">s3</text><text x="900" y="272">s4</text><text x="1100" y="212">s5</text></g>
<g class="s" text-anchor="middle"><text x="200" y="188">&lt;= 1</text><text x="400" y="221">&lt;= 1</text><text x="600" y="210">&lt;= 1</text><text x="800" y="215">&lt;= 1</text><text x="1000" y="225">&lt;= 1</text></g>
<path d="M100 330C360 520 840 520 1100 330" fill="none" stroke="#a371f7" stroke-width="5" marker-end="url(#a)"/><text x="600" y="390" text-anchor="middle" class="m">||phi(s5)-phi(s0)|| &lt;= Sum ||Delta phi_t|| &lt;= 5</text><text x="600" y="540" text-anchor="middle" class="t">Choose the shortest path and the bound becomes temporal distance.</text><text x="600" y="578" text-anchor="middle" class="s">This is an upper bound, not exact recovery of every pairwise distance.</text>
</svg>
