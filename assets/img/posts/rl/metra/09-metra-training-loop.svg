<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">METRA training loop</title><desc id="d">SAC updates the policy while dual gradient descent updates the representation and Lagrange multiplier.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8b949e"/></marker></defs>
<rect width="1200" height="620" fill="#0d1117"/><style>text{font-family:Arial,sans-serif;letter-spacing:0}.h{font-size:28px;font-weight:700;fill:#f0f3f6}.k{font-size:19px;font-weight:700;fill:#f0f3f6}.s{font-size:15px;fill:#8b949e}.m{font:17px monospace;fill:#f2cc60}</style>
<text x="40" y="55" class="h">METRA trains a controller and a metric-aware representation together</text>
<g><rect x="45" y="120" width="175" height="105" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="132" y="160" text-anchor="middle" class="k">sample z</text><text x="132" y="190" text-anchor="middle" class="s">fixed per episode</text>
<rect x="285" y="120" width="205" height="105" rx="6" fill="#161b22" stroke="#39d0d8" stroke-width="2"/><text x="387" y="160" text-anchor="middle" class="k">policy pi(a|s,z)</text><text x="387" y="190" text-anchor="middle" class="s">SAC actor and critic</text>
<rect x="555" y="120" width="205" height="105" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="2"/><text x="657" y="160" text-anchor="middle" class="k">environment</text><text x="657" y="190" text-anchor="middle" class="s">transition (s,z,s')</text>
<rect x="825" y="120" width="325" height="105" rx="6" fill="#161b22" stroke="#56d364" stroke-width="2"/><text x="987" y="160" text-anchor="middle" class="k">representation phi</text><text x="987" y="190" text-anchor="middle" class="s">reward and constraint</text><path d="M221 172H273M491 172H543M761 172H813" stroke="#8b949e" stroke-width="3" marker-end="url(#a)"/></g>
<rect x="360" y="285" width="480" height="100" rx="6" fill="#161b22" stroke="#f2cc60" stroke-width="2"/><text x="600" y="326" text-anchor="middle" class="m">r = (phi(s') - phi(s))^T z</text><text x="600" y="357" text-anchor="middle" class="s">the learned representation creates the SAC reward</text><path d="M987 226C987 270 842 292 842 320" fill="none" stroke="#f2cc60" stroke-width="3" marker-end="url(#a)"/>
<rect x="85" y="450" width="305" height="105" rx="6" fill="#161b22" stroke="#39d0d8" stroke-width="2"/><text x="237" y="490" text-anchor="middle" class="k">SAC update</text><text x="237" y="521" text-anchor="middle" class="s">maximize intrinsic return</text>
<rect x="455" y="450" width="305" height="105" rx="6" fill="#161b22" stroke="#56d364" stroke-width="2"/><text x="607" y="490" text-anchor="middle" class="k">phi update</text><text x="607" y="521" text-anchor="middle" class="s">direction plus dual constraint</text>
<rect x="825" y="450" width="290" height="105" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="970" y="490" text-anchor="middle" class="k">lambda update</text><text x="970" y="521" text-anchor="middle" class="s">penalize violations</text>
<path d="M478 386C430 420 350 424 300 444M600 386V438M722 386C770 420 850 424 900 444" fill="none" stroke="#8b949e" stroke-width="3" marker-end="url(#a)"/>
</svg>
