<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">From WDM to the METRA reward</title><desc id="d">Four simplifications turn the Wasserstein dependency measure into a transition reward.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8b949e"/></marker></defs>
<rect width="1200" height="620" fill="#0d1117"/><style>text{font-family:Arial,sans-serif;letter-spacing:0}.h{font-size:28px;font-weight:700;fill:#f0f3f6}.k{font-size:19px;font-weight:700;fill:#f0f3f6}.s{font-size:16px;fill:#8b949e}.m{font:18px monospace;fill:#c9d1d9}.o{font:bold 22px monospace;fill:#f2cc60}</style>
<text x="40" y="55" class="h">WDM becomes a transition reward through four simplifications</text>
<g><rect x="35" y="105" width="250" height="155" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="55" y="140" class="k">1. WDM</text><text x="55" y="185" class="m">W(p(s,z), p(s)p(z))</text><text x="55" y="225" class="s">Use a metric-aware</text><text x="55" y="246" class="s">dependency measure.</text>
<rect x="325" y="105" width="250" height="155" rx="6" fill="#161b22" stroke="#39d0d8" stroke-width="2"/><text x="345" y="140" class="k">2. KR dual</text><text x="345" y="185" class="m">sup E_joint[f]</text><text x="345" y="214" class="m"> - E_indep[f]</text><text x="345" y="246" class="s">with Lipschitz f</text>
<rect x="615" y="105" width="250" height="155" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="2"/><text x="635" y="140" class="k">3. Factor</text><text x="635" y="183" class="m">f=phi(s)^T psi(z)</text><text x="635" y="215" class="m">psi(z)=z, E[z]=0</text><text x="635" y="246" class="s">Use endpoint S_T.</text>
<rect x="905" y="105" width="260" height="155" rx="6" fill="#161b22" stroke="#56d364" stroke-width="2"/><text x="925" y="140" class="k">4. Telescope</text><text x="925" y="183" class="m">phi(sT)-phi(s0)</text><text x="925" y="215" class="m">= Sum Delta phi_t</text><text x="925" y="246" class="s">Get a step reward.</text><path d="M286 182H313M576 182H603M866 182H893" stroke="#8b949e" stroke-width="3" marker-end="url(#a)"/></g>
<rect x="145" y="330" width="910" height="185" rx="6" fill="#161b22" stroke="#30363d"/><text x="600" y="382" text-anchor="middle" class="o">r_t = (phi(s_{t+1}) - phi(s_t))^T z</text><text x="600" y="430" text-anchor="middle" class="m">subject to ||phi(s)-phi(s')||_2 &lt;= 1 for adjacent states</text><text x="600" y="478" text-anchor="middle" class="s">A tractable approximation, not the unrestricted full WDM.</text>
</svg>
