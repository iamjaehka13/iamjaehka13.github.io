<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CIC official code update flow</title>
  <desc id="desc">Skill sampling, contrastive representation learning, particle reward, and DDPG update flow</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7f8798"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="1" stop-color="#151925"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 100 H1200" stroke="#252b39"/>
  <text x="60" y="58" fill="#f5f3ee" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">CIC OFFICIAL CODE</text>
  <text x="60" y="86" fill="#9299aa" font-family="Inter, Arial, sans-serif" font-size="17">one replay batch, two learning paths</text>
  <text x="1140" y="64" text-anchor="end" fill="#f3c969" font-family="JetBrains Mono, monospace" font-size="18">B x 64</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="60" y="150" width="220" height="170" rx="6" fill="#11151e" stroke="#f3c969" stroke-width="2"/>
    <text x="84" y="186" fill="#f3c969" font-size="16" font-weight="700">01  META</text>
    <text x="84" y="226" fill="#f5f3ee" font-size="22" font-weight="650">Sample skill z</text>
    <text x="84" y="260" fill="#aeb4c2" font-size="17">Uniform [0, 1]^64</text>
    <text x="84" y="291" fill="#aeb4c2" font-size="17">refresh every 50 steps</text>

    <rect x="340" y="150" width="220" height="170" rx="6" fill="#11151e" stroke="#a78bfa" stroke-width="2"/>
    <text x="364" y="186" fill="#a78bfa" font-size="16" font-weight="700">02  CPC</text>
    <text x="364" y="226" fill="#f5f3ee" font-size="22" font-weight="650">Match z and (s, s')</text>
    <text x="364" y="260" fill="#aeb4c2" font-size="17">query: skill_net(z)</text>
    <text x="364" y="291" fill="#aeb4c2" font-size="17">key: pred_net(states)</text>

    <rect x="620" y="150" width="220" height="170" rx="6" fill="#11151e" stroke="#54d2d2" stroke-width="2"/>
    <text x="644" y="186" fill="#54d2d2" font-size="16" font-weight="700">03  APT</text>
    <text x="644" y="226" fill="#f5f3ee" font-size="22" font-weight="650">Build k-NN reward</text>
    <text x="644" y="260" fill="#aeb4c2" font-size="17">state_net(next_obs)</text>
    <text x="644" y="291" fill="#aeb4c2" font-size="17">distance, RMS, clip, log</text>

    <rect x="900" y="150" width="240" height="170" rx="6" fill="#11151e" stroke="#fb923c" stroke-width="2"/>
    <text x="924" y="186" fill="#fb923c" font-size="16" font-weight="700">04  DDPG</text>
    <text x="924" y="226" fill="#f5f3ee" font-size="22" font-weight="650">Update policy</text>
    <text x="924" y="260" fill="#aeb4c2" font-size="17">twin-Q critic target</text>
    <text x="924" y="291" fill="#aeb4c2" font-size="17">actor loss = -Q</text>

    <path d="M280 235 H328" stroke="#7f8798" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M560 235 H608" stroke="#7f8798" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M840 235 H888" stroke="#7f8798" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="60" y="382" fill="#f5f3ee" font-size="19" font-weight="650">Gradient paths</text>
    <path d="M60 412 H1140" stroke="#252b39"/>

    <circle cx="98" cy="466" r="8" fill="#a78bfa"/>
    <text x="122" y="472" fill="#c7cbd4" font-size="18">CPC loss</text>
    <path d="M228 466 H352" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="378" y="472" fill="#f5f3ee" font-size="18">state_net + skill_net + pred_net</text>
    <text x="825" y="472" fill="#7f8798" font-size="17">actor receives no direct CPC gradient</text>

    <circle cx="98" cy="530" r="8" fill="#54d2d2"/>
    <text x="122" y="536" fill="#c7cbd4" font-size="18">k-NN reward</text>
    <path d="M246 530 H352" stroke="#54d2d2" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="378" y="536" fill="#f5f3ee" font-size="18">critic target</text>
    <path d="M504 530 H610" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="636" y="536" fill="#f5f3ee" font-size="18">Q(s, z, a)</text>
    <path d="M768 530 H874" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="900" y="536" fill="#f5f3ee" font-size="18">actor</text>
  </g>
</svg>
