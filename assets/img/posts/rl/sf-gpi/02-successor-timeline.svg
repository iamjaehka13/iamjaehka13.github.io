<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Immediate features and successor features over time</title>
  <desc id="desc">Successor features are the discounted sum of future transition features under a policy.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="34" font-weight="700">φ는 지금, ψ는 정책을 계속 따랐을 때의 미래 누적</text>

  <line x1="120" y1="245" x2="1080" y2="245" stroke="#94a3b8" stroke-width="4"/>
  <g fill="#ffffff" stroke="#60a5fa" stroke-width="5">
    <circle cx="160" cy="245" r="22"/>
    <circle cx="380" cy="245" r="22"/>
    <circle cx="600" cy="245" r="22"/>
    <circle cx="820" cy="245" r="22"/>
    <circle cx="1040" cy="245" r="22"/>
  </g>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">
    <text x="160" y="195">φₜ₊₁</text>
    <text x="380" y="195">γ φₜ₊₂</text>
    <text x="600" y="195">γ² φₜ₊₃</text>
    <text x="820" y="195">γ³ φₜ₊₄</text>
    <text x="1040" y="195">...</text>
  </g>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <text x="160" y="292">current transition</text>
    <text x="380" y="292">future under π</text>
    <text x="600" y="292">future under π</text>
    <text x="820" y="292">future under π</text>
  </g>

  <path d="M 155 340 C 320 430, 880 430, 1045 340" fill="none" stroke="#31c48d" stroke-width="5"/>
  <polygon points="1045,340 1013,340 1030,365" fill="#31c48d"/>
  <rect x="285" y="390" width="630" height="74" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="600" y="437" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="28">ψᵖⁱ(s,a) = Eᵖⁱ[Σₖ γᵏ φₜ₊ₖ₊₁]</text>
  <text x="600" y="110" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="22">단순 state embedding이 아니라 policy-conditioned predictive representation</text>
</svg>
