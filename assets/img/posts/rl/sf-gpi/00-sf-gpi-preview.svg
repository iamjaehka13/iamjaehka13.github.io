<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Successor Features and Generalized Policy Improvement</title>
  <desc id="desc">Future feature predictions are combined with a new reward weight to reuse policies.</desc>
  <rect width="1200" height="630" fill="#101827"/>
  <rect x="0" y="0" width="18" height="630" fill="#38bdf8"/>
  <text x="82" y="108" fill="#91a4bd" font-family="Arial, sans-serif" font-size="24">TRANSFER REINFORCEMENT LEARNING</text>
  <text x="80" y="222" fill="#f8fafc" font-family="Arial, sans-serif" font-size="82" font-weight="700">SF + GPI</text>
  <text x="84" y="286" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="31">Successor Features</text>
  <text x="84" y="330" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="31">Generalized Policy Improvement</text>
  <text x="84" y="405" fill="#f8fafc" font-family="Arial, sans-serif" font-size="29">미래 행동 결과를 새 보상에 재사용하기</text>
  <rect x="84" y="460" width="470" height="92" rx="7" fill="#172235" stroke="#334155"/>
  <text x="112" y="498" fill="#60a5fa" font-family="Arial, sans-serif" font-size="23">future features</text>
  <text x="322" y="498" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="23">× new preference</text>
  <text x="112" y="536" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28">Q = ψᵀw</text>

  <rect x="655" y="86" width="455" height="465" rx="8" fill="#172235" stroke="#334155" stroke-width="2"/>
  <text x="882" y="130" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="23">source policy library</text>
  <g>
    <rect x="710" y="170" width="110" height="68" rx="6" fill="#1e3a5f" stroke="#60a5fa"/>
    <text x="765" y="212" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="22">π₁, ψ₁</text>
    <rect x="827" y="170" width="110" height="68" rx="6" fill="#164e63" stroke="#22d3ee"/>
    <text x="882" y="212" text-anchor="middle" fill="#cffafe" font-family="Arial, sans-serif" font-size="22">π₂, ψ₂</text>
    <rect x="944" y="170" width="110" height="68" rx="6" fill="#14532d" stroke="#4ade80"/>
    <text x="999" y="212" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="22">π₃, ψ₃</text>
  </g>
  <line x1="765" y1="238" x2="850" y2="330" stroke="#60a5fa" stroke-width="4"/>
  <line x1="882" y1="238" x2="882" y2="330" stroke="#22d3ee" stroke-width="4"/>
  <line x1="999" y1="238" x2="914" y2="330" stroke="#4ade80" stroke-width="4"/>
  <rect x="794" y="330" width="176" height="70" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="882" y="359" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="19">new task w</text>
  <text x="882" y="385" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22">maxᵢ ψᵢᵀw</text>
  <line x1="882" y1="400" x2="882" y2="455" stroke="#f59e0b" stroke-width="5"/>
  <polygon points="882,478 865,447 899,447" fill="#f59e0b"/>
  <text x="882" y="518" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25">GPI action</text>
