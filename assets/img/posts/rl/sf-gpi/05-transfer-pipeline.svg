<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Successor features and GPI transfer pipeline</title>
  <desc id="desc">Source policies and their successor features are stored, a new reward weight is estimated, and GPI provides immediate behavior before optional learning.</desc>
  <rect width="1200" height="590" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="34" font-weight="700">새 task에서 다시 RL을 시작하기 전 얻는 jump-start</text>

  <rect x="45" y="115" width="260" height="310" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="175" y="158" text-anchor="middle" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Source tasks</text>
  <rect x="82" y="192" width="186" height="52" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="175" y="225" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="21">π₁, ψᵖ¹, w₁</text>
  <rect x="82" y="262" width="186" height="52" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="175" y="295" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="21">π₂, ψᵖ², w₂</text>
  <rect x="82" y="332" width="186" height="52" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="175" y="365" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="21">π₃, ψᵖ³, w₃</text>

  <line x1="305" y1="270" x2="390" y2="270" stroke="#64748b" stroke-width="5"/>
  <polygon points="410,270 382,255 382,285" fill="#64748b"/>

  <rect x="410" y="115" width="300" height="310" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="560" y="158" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="26" font-weight="700">New task</text>
  <text x="560" y="210" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="22">reward samples</text>
  <text x="560" y="250" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="22">r ≈ φᵀw_new</text>
  <line x1="560" y1="275" x2="560" y2="324" stroke="#16a34a" stroke-width="5"/>
  <polygon points="560,344 545,316 575,316" fill="#16a34a"/>
  <rect x="474" y="344" width="172" height="52" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="560" y="377" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="22">estimate w_new</text>

  <line x1="710" y1="270" x2="795" y2="270" stroke="#64748b" stroke-width="5"/>
  <polygon points="815,270 787,255 787,285" fill="#64748b"/>

  <rect x="815" y="115" width="340" height="310" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="985" y="158" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="26" font-weight="700">GPI</text>
  <text x="985" y="213" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="23">Qᵢ = ψᵖⁱᵀ w_new</text>
  <text x="985" y="258" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="23">π_GPI = greedy(maxᵢ Qᵢ)</text>
  <rect x="865" y="304" width="240" height="73" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="985" y="334" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="20">zero-shot / jump-start</text>
  <text x="985" y="362" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="18">before target-task RL</text>

  <path d="M 985 425 L 985 490 L 560 490 L 560 450" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 7"/>
  <polygon points="560,430 545,458 575,458" fill="#f59e0b"/>
  <text x="780" y="526" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="21">optional: target task를 더 학습하고 새 policy/SF를 library에 추가</text>
</svg>
