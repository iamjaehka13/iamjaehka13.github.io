<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Policy count versus successor feature coverage</title>
  <desc id="desc">A useful policy library covers extremal successor feature directions rather than containing many redundant policies.</desc>
  <rect width="1200" height="610" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="34" font-weight="700">많은 policy보다 SF 공간의 유용한 극단을 덮는 것이 중요하다</text>

  <rect x="45" y="100" width="535" height="445" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="312" y="145" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="27" font-weight="700">Redundant library</text>
  <line x1="115" y1="470" x2="520" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <line x1="115" y1="470" x2="115" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#f59e0b" stroke="#b45309" stroke-width="2">
    <circle cx="335" cy="302" r="13"/>
    <circle cx="360" cy="286" r="13"/>
    <circle cx="386" cy="309" r="13"/>
    <circle cx="348" cy="330" r="13"/>
    <circle cx="408" cy="282" r="13"/>
    <circle cx="375" cy="345" r="13"/>
    <circle cx="420" cy="328" r="13"/>
    <circle cx="399" cy="360" r="13"/>
  </g>
  <line x1="115" y1="470" x2="495" y2="218" stroke="#ef4444" stroke-width="5"/>
  <polygon points="520,202 485,208 504,235" fill="#ef4444"/>
  <text x="335" y="205" fill="#b91c1c" font-family="Arial, sans-serif" font-size="21">new reward direction w</text>
  <text x="312" y="515" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="20">개수는 많지만 같은 behavior outcome에 몰림</text>

  <rect x="620" y="100" width="535" height="445" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="887" y="145" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="27" font-weight="700">Extremal coverage</text>
  <line x1="690" y1="470" x2="1095" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <line x1="690" y1="470" x2="690" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="745,420 825,235 1025,210 1080,400 900,450" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <g fill="#31c48d" stroke="#166534" stroke-width="2">
    <circle cx="745" cy="420" r="13"/>
    <circle cx="825" cy="235" r="13"/>
    <circle cx="1025" cy="210" r="13"/>
    <circle cx="1080" cy="400" r="13"/>
    <circle cx="900" cy="450" r="13"/>
  </g>
  <line x1="690" y1="470" x2="1070" y2="218" stroke="#ef4444" stroke-width="5"/>
  <polygon points="1095,202 1060,208 1079,235" fill="#ef4444"/>
  <circle cx="1025" cy="210" r="22" fill="none" stroke="#ef4444" stroke-width="4"/>
  <text x="875" y="195" fill="#b91c1c" font-family="Arial, sans-serif" font-size="21">high projection policy</text>
  <text x="887" y="515" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="20">서로 다른 선형 reward 방향에서 선택될 극단점 확보</text>
</svg>
