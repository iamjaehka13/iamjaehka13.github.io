<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Action value decomposition using successor features</title>
  <desc id="desc">Action value is decomposed into policy-conditioned future feature predictions and task reward weights.</desc>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="34" font-weight="700">Q-function에 섞여 있던 두 질문을 분리한다</text>

  <rect x="55" y="100" width="500" height="330" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="305" y="150" text-anchor="middle" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Successor Features ψᵖⁱ(s,a)</text>
  <text x="305" y="194" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="24">앞으로 무엇이 얼마나 발생하는가?</text>
  <rect x="105" y="238" width="400" height="126" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="135" y="276" fill="#475569" font-family="Arial, sans-serif" font-size="22">forward progress</text>
  <rect x="330" y="258" width="130" height="18" rx="4" fill="#60a5fa"/>
  <text x="135" y="315" fill="#475569" font-family="Arial, sans-serif" font-size="22">energy use</text>
  <rect x="330" y="297" width="90" height="18" rx="4" fill="#f59e0b"/>
  <text x="135" y="354" fill="#475569" font-family="Arial, sans-serif" font-size="22">collision risk</text>
  <rect x="330" y="336" width="48" height="18" rx="4" fill="#ef4444"/>
  <text x="305" y="405" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="20">dynamics + policy + feature representation</text>

  <text x="600" y="286" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="50">×</text>

  <rect x="645" y="100" width="500" height="330" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="895" y="150" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="28" font-weight="700">Reward weights w</text>
  <text x="895" y="194" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="24">그 결과를 얼마나 좋아하는가?</text>
  <rect x="695" y="238" width="400" height="126" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="725" y="276" fill="#475569" font-family="Arial, sans-serif" font-size="22">forward progress</text>
  <text x="1050" y="276" text-anchor="end" fill="#16a34a" font-family="Arial, sans-serif" font-size="23">+1.0</text>
  <text x="725" y="315" fill="#475569" font-family="Arial, sans-serif" font-size="22">energy use</text>
  <text x="1050" y="315" text-anchor="end" fill="#dc2626" font-family="Arial, sans-serif" font-size="23">-0.2</text>
  <text x="725" y="354" fill="#475569" font-family="Arial, sans-serif" font-size="22">collision risk</text>
  <text x="1050" y="354" text-anchor="end" fill="#dc2626" font-family="Arial, sans-serif" font-size="23">-2.0</text>
  <text x="895" y="405" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="20">task preference</text>

  <rect x="325" y="465" width="550" height="66" rx="7" fill="#172033"/>
  <text x="600" y="507" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="30">Qᵖⁱ_w(s,a) = ψᵖⁱ(s,a)ᵀ w</text>
</svg>
