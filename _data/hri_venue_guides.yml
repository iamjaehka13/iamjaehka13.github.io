      - label: RO-MAN — Conference History
        url: "https://ro-man.org/"

  - slug: hai
    order: 4
    group: conference
    badge: HAI
    name: HAI
    full_name: International Conference on Human-Agent Interaction
    meta: Human–Agent Interaction · Interdisciplinary
    accent: "#7556a8"
    accent_dark: "#533a7d"
    accent_soft: "#f0ebf8"
    hub_intro: >-
      HAI를 “robot 없는 HRI”로 설명하면 일반화 대상의 차이를 놓친다.
      HAI는 physical robot, virtual agent, avatar, agentic AI, digitally mediated interaction 등 다양한 context를 열고
      <strong>human–agent interaction 자체의 기여</strong>를 묻는다.
    hub_detail: >-
      HRI도 physical robot 없는 연구를 받을 수 있으므로 구분 기준은 embodiment 유무가 아니다.
      특정 agent 하나를 다룬 연구도 가능하며, 결과가 human–robot interaction보다 broader human–agent literature와 독자에게 말하는지가 더 정확한 경계다.
    definition: >-
      Physical robot부터 virtual character와 agentic AI까지 다양한 agent 맥락에서 사람의 perception·trust·collaboration을 연구하는 interdisciplinary conference
    thesis: >-
      HAI의 중심 질문은 <strong>agent가 어떤 몸을 가졌는가보다 사람이 agency를 어떻게 지각하고 관계를 형성하는가</strong>다.
    thesis_note: >-
      HAI 2026은 robot, virtual agent, digitally mediated human–human communication뿐 아니라 agentic AI,
      delegation, social simulation, avatar까지 conventional interaction boundary를 넓혀 다룬다.
    facts:
      - value: Many Agent Forms
        label: Physical robot · virtual agent · avatar · conversational and agentic AI
      - value: Human–Agent
        label: 특정 embodiment보다 agency와 interaction을 공통 기준점으로 사용
      - value: Interdisciplinary
        label: Computing · psychology · communication · design · social science
      - value: HAI 2026
        label: Agentic AI · delegation · collaboration · trust를 공식 scope에 포함
    identity:
      - title: Primary knowledge unit
        text: >-
          하나 또는 여러 agent form에서 embodiment, autonomy, identity, social cue가 사람의
          trust·delegation·coordination·relationship을 어떻게 바꾸는지 설명한다.
      - title: Reviewer가 먼저 보는 것
        text: >-
          Human–agent interaction에 original theoretical, methodological, technical 또는 empirical contribution이 있는지,
          그리고 chosen agent form과 evidence가 claim에 적절한지를 본다.
    scope:
      - title: Agent forms
        items:
          - Robot and embodied agent
          - Virtual human and avatar
          - Conversational and voice agent
          - Agentic and generative AI
      - title: Interaction
        items:
          - Trust · delegation · collaboration
          - Social cue and relationship
          - Identity · presence · embodiment
          - Human–AI teamwork
      - title: Methods · society
        items:
          - Quantitative and qualitative study
          - Design and technical system
          - Theory and social simulation
          - Ethics and societal consequence
    rule:
      label: HAI의 기본 단위
      text: >-
        <strong>특정 agent 하나를 다루더라도 human–agent interaction에 어떤 original contribution을 남기는가</strong>를 본다.
        Cross-agent comparison이나 cross-form generalization은 가능한 기여 형식이지 공식 필수요건이 아니다.
    position:
      - label: Primary claim
        text: Robot, virtual agent, avatar, agentic AI 등 하나 이상의 form에서 얻은 human–agent perception, behavior, design or collaboration contribution.
      - label: Core audience
        text: HAI, HCI, HRI, conversational agent, virtual human and human-centered AI researcher.
      - label: Evidence
        text: Experiment, qualitative study, system, design, theory, simulation 또는 필요한 경우 cross-agent comparison.
      - label: HAI lens
        text: 선택한 agent 맥락에서 human–agent interaction에 남는 기여가 선명한가.
      - label: Strong signal
        text: Human–agent interaction에 명확한 theoretical, methodological, technical 또는 empirical contribution이 남는다.
      - label: Weak signal
        text: Physical contact·robot control만이 핵심이고 human–agent interaction contribution이 결론에 없다.
    neighbors: >-
      CHI는 HCI 전반에 남는 contribution을 요구하고, HRI는 human–robot interaction을 중심에 둔다.
      ICSR은 social robot의 역할과 사회적 배치가 더 핵심이다.
    boundary: >-
      HAI와 HRI 모두 physical·virtual comparison을 다룰 수 있다. 차이는 제출물의 이름표가 아니라
      paper가 최종적으로 human–agent interaction과 human–robot interaction 중 어느 literature와 독자에게 말하는지에 있다.
    snapshot:
      - value: Official scope
        label: Robot · virtual agent · mediated interaction · agentic AI
      - value: Typical evidence
        label: Interaction study, design, system, theory or method에 맞는 evidence
      - value: Strong fit
        label: Human–agent interaction에 명확한 original contribution
      - value: Recheck fit
        label: Robot physicality와 control이 conclusion 전체를 규정
    position_note: >-
      HAI 2026은 agentic AI를 별도 관심사로 포함한다. 하지만 LLM이나 agent를 사용했다는 사실만으로 fit이 생기지는 않는다.
      사람이 agency를 어떻게 해석하고 협업·위임·신뢰하는지에 관한 interaction contribution이 필요하다.
    taste_intro: >-
      좋은 HAI paper는 agent 종류를 늘어놓는 대신 <strong>선택한 agent와 interaction을 통해 어떤 original HAI contribution을 만들었는지</strong>가 선명하다.
    matrix:
      - axis: Problem
        sound: Robot과 avatar의 선호도를 비교
        shaped: Embodiment·presence·agency 중 어떤 mechanism을 분리하는 비교인지 명시
      - axis: Claim
        sound: 한 agent가 더 신뢰받음
        shaped: Agent form이 trust·delegation·coordination을 바꾸는 일반 원리를 설명
      - axis: Evidence
        sound: Rating과 task result
        shaped: Perception·behavior·interaction trace와 manipulation validity를 함께 제시
      - axis: Framing
        sound: 여러 agent interface를 소개
        shaped: Human–agent literature의 gap과 robot 밖에 남는 consequence가 보임
    framing:
      diffuse:
        sample: “같은 LLM을 robot과 화면 avatar에 넣고 호감도를 비교했다.”
        explain: Agent type은 두 개지만 무엇을 이론적으로 분리하는지 아직 약하다.
      shaped:
        sample: “동일한 policy의 physical co-presence와 virtual representation을 분리해 delegation threshold와 error tolerance의 변화를 설명한다.”
        explain: Embodiment manipulation과 general human–agent claim이 직접 연결된다.
    lessons:
      - title: Agent type을 독립변수로만 쓰지 않는다
        text: Embodiment, presence, autonomy, identity 중 어떤 mechanism을 뜻하는지 정의한다.
      - title: HRI와의 차이를 physicality 하나로 만들지 않는다
        text: HRI도 non-physical comparison을 받을 수 있으므로 generalization target을 쓴다.
      - title: Agentic AI의 agency를 검토한다
        text: 위임, control, responsibility, expectation이 interaction에서 어떻게 구성되는지 본다.
      - title: Cross-form validity를 확인한다
        text: Robot과 avatar의 visual·timing·capability 차이가 confound가 되지 않게 설계한다.
      - title: Broader audience에 답한다
        text: 한 platform의 UX를 넘어 HAI researcher가 다시 사용할 principle을 남긴다.
    submit:
      big: Human–agent interaction
      small: 선택한 agent 맥락에서 어떤 original contribution이 남는가?
      items:
        - <b>Agent forms:</b> physical · virtual · conversational · agentic
        - <b>Mechanism:</b> presence · agency · identity · autonomy
        - <b>Evidence:</b> claim-aligned study · system · design · theory
        - <b>Boundary:</b> HRI-specific physical question과 분리
    final:
      big: >-
        가장 간결하게 말하면, <strong>HAI는 다양한 agent 맥락에서 인간이 agency와 관계를 어떻게 구성하는지 연구하는 conference</strong>다.
      small: >-
        좋은 HAI paper는 여러 agent를 비교해서가 아니라 human–agent interaction에 남는 original contribution을 분명히 만든다.
    spectrum_intro: >-
      아래 질문은 HAI 2026 scope를 바탕으로 physical·virtual·agentic form을 가로지르는 research spectrum을 보여주는 편집 예시다.
    hero_question:
      tag: Embodiment
      title: 동일한 agent policy라도 physical co-presence가 delegation과 responsibility를 바꾸는가?
      text: Agent form의 차이를 human–agent interaction mechanism으로 일반화하는 대표 질문.
    questions:
      - tag: Agentic AI
        title: 사람은 autonomous agent에게 언제 task와 decision authority를 위임하는가?
        text: Delegation, control, accountability를 다루는 질문.
      - tag: Virtual human
        title: Avatar의 identity와 social cue가 disclosure를 어떻게 바꾸는가?
        text: Presence, relationship, mediated interaction을 연결하는 질문.
      - tag: Cross-agent
        title: Robot·voice agent·avatar의 error는 왜 다르게 용서되는가?
        text: Embodiment와 expectation의 일반 원리를 분리하는 질문.
      - tag: Human–AI team
        title: Agent가 teammate로 받아들여질 때 역할 협상은 어떻게 달라지는가?
        text: Coordination, mental model, team identity를 다루는 질문.
      - tag: Design
        title: 여러 agent form에서 일관되게 작동하는 feedback language는 무엇인가?
        text: Cross-platform interaction technique와 design knowledge 질문.
      - tag: Society · ethics
        title: Digital agent의 representation은 stereotype과 power를 어떻게 재생산하는가?
        text: Identity, ethics, social consequence를 interaction과 연결하는 질문.
    selection_note: >-
      HAI의 넓은 scope는 agent가 등장하는 모든 AI paper를 뜻하지 않는다. Human–agent interaction에 남는 명확한 contribution이 여전히 중심이다.
    sources:
      - label: HAI 2026 — Conference Scope and Topics
        url: "https://hai-conference.net/hai2026/"
      - label: HAI 2026 — Call for Full Papers
        url: "https://hai-conference.net/hai2026/call-for-full-papers/"
      - label: HRI 2026 — Full Papers and Non-physical Robot Guidance
        url: "https://humanrobotinteraction.org/2026/full-papers/"

  - slug: icsr
    order: 5
    group: conference
    badge: ICSR
    name: ICSR
    full_name: International Conference on Social Robotics
    meta: Social Robotics Conference · Interdisciplinary
    accent: "#a44f61"
    accent_dark: "#793444"
    accent_soft: "#faecef"
    hub_intro: >-
      ICSR을 “social behavior user study만 받는 곳”으로 보면 범위를 지나치게 좁힌다.
      Regular Paper는 technically rigorous original research를 요구하고, Short Paper·Grand Challenge·Debate Proposal·Robot Fringe 같은
      별도 형식이 exploratory·creative work, art·performance·debate·robot design을 확장한다.
    hub_detail: >-
      ICSR의 공식 범위는 social robotics의 core technologies, interaction, design, applications와 societal impact를 함께 포괄한다.
      Social actor·companion·tutor·caregiver role은 대표적인 fit이지만 모든 paper의 필수 frame은 아니다.
    definition: >-
      Social robot의 enabling technology부터 behavior, design, application, ethics와 사회적 역할까지 하나의 interdisciplinary community에서 다루는 conference
    thesis: >-
      ICSR의 중심 질문은 <strong>이 연구가 social robotics의 기술·interaction·design·application·societal understanding을
      어떻게 전진시키는가</strong>다.
    thesis_note: >-
      Official call은 technically rigorous advance를 요구하면서 design, application, societal impact도 함께 열어 둔다.
      Technical과 social contribution을 서로 배타적인 축으로 보지 않는 것이 중요하다.
    facts:
      - value: Social Robotics
        label: Core technology · interaction · application · societal impact를 포괄
      - value: Full Spectrum
        label: Core technology · design · application · social impact
      - value: Applied Contexts
        label: Assistive · medical · healthcare · education · entertainment · immersive-media applications
      - value: Multiple Formats
        label: Creative work·debate·performance는 Short Paper·Grand Challenge·Debate Proposal·Robot Fringe 등 별도 call로 운영
    identity:
      - title: Primary knowledge unit
        text: >-
          Core technology, embodied·adaptive intelligence, interaction, design, application 또는 societal study를 통해
          social robotics를 전진시키는 contribution.
      - title: Reviewer가 먼저 보는 것
        text: >-
          주장한 social-robotics contribution이 original and rigorous한지,
          선택한 technical·empirical·design·societal evidence가 그 claim을 지지하는지를 본다.
    scope:
      - title: Social capability
        items:
          - Social perception and cognition
          - Dialogue · affect · personality
          - Embodied intelligence and behavior
          - Adaptive and personalized interaction
      - title: Design · relationship
        items:
          - Morphology and expressive behavior
          - Social presence and embodiment
          - Acceptance · trust · attachment
          - Co-design and participatory process
      - title: Application · society
        items:
          - Care · health · rehabilitation
          - Education · child–robot interaction
          - Ethics · philosophy · moral agency
          - Art · culture · societal impact
    rule:
      label: 편집적 판단 · ICSR의 기본 단위
      text: >-
        Official topic area 안에서 social robotics relevance와 original contribution을 명확히 해야 한다.
        <strong>Social actor나 social role framing은 한 가지 경로이지 필수요건이 아니다.</strong>
    position:
      - label: Primary claim
        text: Social robot의 capability, behavior, relationship, role, design, application 또는 societal consequence.
      - label: Core audience
        text: Social roboticist, HRI researcher, designer, psychologist, ethicist and application-domain researcher.
      - label: Evidence
        text: Regular Paper는 technical·empirical·design evidence를, creative work·debate·performance는 각각의 별도 submission format을 따른다.
      - label: Social lens
        text: 이 연구가 social robotics 또는 공식 topic area에 어떤 진전을 남기는가.
      - label: Strong signal
        text: Social mechanism과 robot role이 결과와 design implication을 함께 조직한다.
      - label: Weak signal
        text: Generic assistant UI 또는 control method이고 social robot이어야 할 이유가 없다.
    neighbors: >-
      HRI는 interaction 자체의 theory·method·technical·system·study contribution을 넓게 받고,
      RO-MAN은 communication과 team·application을 중심으로 조직한다. IJSR은 같은 social-robot spectrum의 archival journal이다.
    boundary: >-
      Social이라는 단어를 emotion이나 귀여움으로 좁히지 않는다. Role, norm, distance, autonomy, care, power, ethics,
      social navigation도 social robotics의 핵심이며 technical system paper도 공식 범위에 포함된다.
    snapshot:
      - value: Official scope
        label: Technical advance · design · application · interaction · societal impact
      - value: Typical evidence
        label: Social capability test, behavioral study, field context or design argument
      - value: Strong fit
        label: Official social-robotics topic에서 original and rigorous contribution
      - value: Recheck fit
        label: Social robotics와의 관련성이 설명되지 않은 generic robotics result
    position_note: >-
      ICSR 2026의 art·performance·debate 요소는 Regular Paper와 동일한 category가 아니다.
      Short Paper, Grand Challenge, Debate Proposal, Robot Fringe 등 각기 다른 call과 형식으로 interdisciplinary program을 구성한다.
    taste_intro: >-
      좋은 ICSR paper는 “사람이 robot을 좋아했다”가 아니라 <strong>어떤 social mechanism과 role이 그 반응을 만들었고 설계에 무엇을 남기는지</strong>를 설명한다.
    matrix:
      - axis: Problem
        sound: Social robot의 새 표정 기능을 평가
        shaped: 어떤 social cue·role·relationship gap을 표정 behavior가 해결하는지 명시
      - axis: Claim
        sound: Likeability와 engagement가 상승
        shaped: Social presence·norm·expectation이 변한 mechanism과 boundary를 설명
      - axis: Evidence
        sound: Survey와 task result
        shaped: Behavior, perception, context, longitudinal consequence를 role claim에 연결
      - axis: Framing
        sound: Robot feature와 application을 소개
        shaped: Social robotics literature와 실제 deployment implication이 첫 페이지에 보임
    framing:
      diffuse:
        sample: “귀여운 눈 모양을 사용한 robot이 더 높은 likeability를 얻었다.”
        explain: Design effect는 있지만 어떤 social relationship mechanism인지 아직 약하다.
      shaped:
        sample: “의존을 요구하지 않는 weak-robot behavior가 가족의 도움·대화·care role을 어떻게 재구성하는지 장기 배치에서 밝힌다.”
        explain: Social role, relationship, field consequence가 하나의 archival question으로 연결된다.
    lessons:
      - title: Sociality를 construct로 정의한다
        text: Likeability 하나가 아니라 presence, norm, role, relationship 중 무엇을 뜻하는지 쓴다.
      - title: Technical contribution을 social consequence에 연결한다
        text: Perception·planning·dialogue가 social behavior를 왜 다르게 만드는지 보여준다.
      - title: Application role을 구체화한다
        text: Tutor, caregiver, companion, coworker의 권한과 기대가 서로 다르다.
      - title: 장기적·사회적 영향을 고려한다
        text: Novelty effect, attachment, dependency, labor, privacy, power를 limitation에 포함한다.
      - title: HRI와 ICSR 독자를 구분한다
        text: Interaction generality보다 social robot identity가 central claim인지 확인한다.
    submit:
      big: Social robot
      small: Social robot의 어떤 capability·behavior·relationship·role을 전진시키는가?
      items:
        - <b>Mechanism:</b> presence · norm · role · relationship
        - <b>Capability:</b> social perception · behavior · adaptation · dialogue
        - <b>Context:</b> care · education · home · public · work
        - <b>Consequence:</b> acceptance · ethics · social impact
    final:
      big: >-
        가장 간결하게 말하면, <strong>ICSR은 social robotics의 core technology·interaction·design·application·사회적 영향을 함께 다루는 conference</strong>다.
      small: >-
        좋은 paper는 robot이 social하게 보였다는 관찰을 넘어, sociality가 어떻게 구성되고 실제 관계와 사회에 무엇을 남기는지 보여준다.
    spectrum_intro: >-
      아래 질문은 ICSR 2026 call이 여는 technical·design·application·societal spectrum을 보여주는 편집 예시다.
    hero_question:
      tag: Social role
      title: Care robot은 도움을 제공하면서 사용자의 autonomy와 관계를 어떻게 보존할 수 있는가?
      text: Capability, interaction behavior, role expectation, ethical consequence가 동시에 만나는 social robotics 질문.
    questions:
      - tag: Social behavior
        title: Robot의 timing·distance·gaze는 어떤 social norm을 전달하는가?
        text: Expressive behavior와 human interpretation을 연결하는 질문.
      - tag: Relationship
        title: 장기 상호작용에서 novelty 이후에도 관계가 어떻게 유지되는가?
        text: Attachment, expectation, repair, disengagement를 다루는 질문.
      - tag: Education
        title: Robot tutor는 authority와 peer role을 어떻게 조절해야 하는가?
        text: Learning outcome뿐 아니라 social role과 classroom practice를 보는 질문.
      - tag: Social navigation
        title: Navigation policy는 거리뿐 아니라 group과 norm을 어떻게 고려해야 하는가?
        text: Technical planning을 social behavior와 연결하는 질문.
      - tag: Ethics
        title: Social robot의 persuasion과 deception은 어디까지 허용되는가?
        text: Moral agency, transparency, vulnerable user를 다루는 질문.
      - tag: Art · design
        title: Performance와 speculative design이 social robot의 미래를 어떻게 비판할 수 있는가?
        text: Artifact와 debate를 social robotics knowledge로 만드는 질문.
    selection_note: >-
      ICSR 2026 공식 topics는 AI·learning·explainability, embodied intelligence·adaptation, assistive·medical robotics 같은 technical 영역과 design·arts·ethics·governance를 함께 포함한다.
    sources:
      - label: ICSR 2026 — Calls and Scope
        url: "https://icsr2026.uk/calls/"
      - label: ICSR 2026 — Topics
        url: "https://icsr2026.uk/topics/"
      - label: International Journal of Social Robotics — Aims and Scope
        url: "https://link.springer.com/journal/12369/aims-and-scope"
      - label: JST/CRDS — Research and Development Trends in HRI (2026)
        url: "https://doi.org/10.82643/crds-fr-s-ro-hri"
