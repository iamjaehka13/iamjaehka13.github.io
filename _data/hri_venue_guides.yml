      - title: Application context를 장식으로 쓰지 않는다
        text: Care, education, logistics의 실제 role과 constraint가 research question을 만들게 한다.
      - title: Technicality를 quality와 혼동하지 않는다
        text: Perspective·design argument도 technicality 부족만으로 배제되지는 않지만 quality와 community contribution은 엄밀해야 한다.
      - title: HRI와의 차이를 서열로 쓰지 않는다
        text: Track-specific HRI claim과 communication-centered program fit을 비교한다.
      - title: Social consequence를 숨기지 않는다
        text: Trust, identity, ethics, power, safety가 system behavior와 어떻게 연결되는지 쓴다.
    submit:
      big: Communication
      small: 사람과 robot은 어떻게 의미와 역할을 조정하는가?
      items:
        - <b>Story:</b> communication · collaboration · coexistence
        - <b>Method:</b> theory부터 system·experiment·design까지 claim에 맞게
        - <b>Context:</b> team·care·education·industry의 실제 constraint
        - <b>Boundary:</b> HRI track 또는 robotics-first framing과 비교
    final:
      big: >-
        가장 간결하게 말하면, <strong>RO-MAN은 사람과 robot의 interactive communication을 넓은 HRI 언어로 조직하는 전문 conference</strong>다.
      small: >-
        좋은 paper는 기술이 얼마나 복잡한가보다, 그 기술·study·design이 사람과 robot의 관계를 어떻게 다르게 만드는지 명확하다.
    spectrum_intro: >-
      아래 질문은 RO-MAN 2026 CFP와 program category를 바탕으로 communication·team·social application의 폭을 보여주는 편집 예시다.
    hero_question:
      tag: Collaboration
      title: Robot이 언제 도움을 제안하고 언제 기다려야 human–robot team이 안정되는가?
      text: Timing, intent inference, communication cue, role negotiation을 하나의 collaborative story로 묶는 질문.
    questions:
      - tag: Multimodal
