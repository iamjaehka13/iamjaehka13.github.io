        text: 여러 channel의 meaning과 repair behavior를 다루는 질문.
      - tag: Social robot
        title: Persona와 emotion 표현이 장기적 관계 기대를 어떻게 만드는가?
        text: Anthropomorphism, trust, social identity를 연결하는 질문.
      - tag: Team
        title: 사람과 robot은 uncertainty와 responsibility를 어떻게 나누는가?
        text: Coordination, shared autonomy, mental model을 다루는 질문.
      - tag: Assistive HRI
        title: 도움은 언제 autonomy를 높이고 언제 통제감을 낮추는가?
