  - slug: ra-l
    order: 12
    group: publication
    badge: RA-L
    name: IEEE Robotics and Automation Letters
    full_name: IEEE Robotics and Automation Letters
    meta: Rapid Robotics Journal · IEEE RAS
    accent: "#b45f24"
    accent_dark: "#7a3d17"
    accent_soft: "#fbefe5"
    hub_intro: >-
      RA-L은 “conference paper에 journal 이름을 붙이는 곳”도, 작은 T-RO도 아니다.
