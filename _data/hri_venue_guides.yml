  - slug: thri
    order: 9
    group: publication
    badge: THRI
    name: ACM THRI
    full_name: ACM Transactions on Human-Robot Interaction
    meta: HRI Archival Journal · ACM
    accent: "#7556a8"
    accent_dark: "#533a7d"
    accent_soft: "#f0ebf8"
    hub_intro: >-
      THRI를 “HRI conference paper를 길게 쓰는 저널”로 이해하면 archival contribution을 놓친다.
      이 journal은 technology, design, behavioral and social science를 가로질러 HRI understanding을 advance하고,
      <strong>state of the art·general knowledge를 추가하거나 기존 이해에 도전</strong>하는 work를 요청한다.
    hub_detail: >-
      Theory, method, reporting guideline, longitudinal deployment, complete system analysis, review처럼
      HRI community 전체에 오래 남을 지식이 자연스럽다. Conference extension은 한 경로일 뿐 필수 identity가 아니다.
    definition: >-
      HRI 전반의 theory, method, design, technology, empirical knowledge와 synthesis를 interdisciplinary archival article로 남기는 ACM journal
    thesis: >-
      THRI의 핵심은 분량이 아니라 <strong>HRI community에 오래 남을 general knowledge와 충분히 완결된 evidence</strong>다.
    thesis_note: >-
      한 study의 결과도 가능하지만 broad-interest implication이 선명해야 한다.
      여러 study·deployment·method를 묶는 work는 conference-size snapshot을 넘어 archival claim을 만들기 좋다.
    facts:
      - value: HRI Archival
        label: Human–robot interaction 전반을 위한 dedicated ACM Transactions
      - value: Interdisciplinary
        label: Robotics · computing · engineering · design · behavioral and social science
      - value: General Knowledge
        label: State of the art를 확장하거나 기존 HRI understanding에 도전
      - value: Many Article Forms
        label: Theory · method · empirical study · system · review and synthesis
    identity:
      - title: Primary knowledge unit
        text: >-
          HRI theory, construct, measure, design principle, technical method, field evidence 또는 synthesis가
          한 platform과 한 setting을 넘어 broad HRI audience에게 이해 가능하고 reusable해야 한다.
      - title: Editor와 reviewer가 보는 것
        text: >-
          Scholarly quality, novelty, broad HRI interest, interdisciplinary intelligibility와 evidence completeness를 본다.
          단순 conference extension이나 추가 참가자 수보다 archival claim의 성숙도가 중요하다.
    scope:
      - title: HRI knowledge
        items:
          - Theory · construct · framework
          - Method · measure · reporting
          - Design knowledge and process
          - Human behavior and relationship
      - title: Technology · systems
        items:
          - HRI-enabling algorithm and tool
          - Complete interactive system
          - Long-term adaptive capability
          - Reproducible system analysis
      - title: Archival evidence
        items:
          - Multiple studies and replication
          - Field and longitudinal deployment
          - Survey · review · synthesis
          - Cross-context comparative work
    rule:
      label: THRI의 기본 단위
      text: >-
        <strong>HRI 전반에 오래 남을 knowledge claim을 하나의 완결된 article로 닫는다</strong>.
        길기만 한 system report나 작은 conference increment는 archival contribution을 대신하지 않는다.
    position:
      - label: Primary claim
        text: Broadly useful, durable HRI knowledge or state-of-the-art advance.
      - label: Core audience
        text: Interdisciplinary HRI community across technical, design, behavioral and social perspectives.
      - label: Evidence
        text: Deep study, multiple studies, field/longitudinal work, theory, method validation, complete system or review.
      - label: Archival lens
        text: 현재 결과가 몇 년 뒤에도 reference point, method, framework 또는 evidence로 남는가.
      - label: Strong signal
        text: Conference-size result를 넘어 evidence와 synthesis가 한 general claim을 완결한다.
      - label: Weak signal
        text: 한 demo의 novelty만 있고 broad HRI implication과 evidence depth가 부족하다.
    neighbors: >-
      HRI conference와 scope는 겹치지만 THRI는 archival completeness와 broad general knowledge에 더 자연스럽다.
      IJSR은 social robot과 사회적 맥락이 중심이고, T-RO는 major robotics advance를 먼저 본다.
    boundary: >-
      Journal은 자동으로 conference보다 “위”가 아니며 conference paper를 길게 늘이는 형식도 아니다.
      Research unit, reader, review cycle과 evidence maturity가 다른 publication choice다.
    snapshot:
      - value: Official scope
        label: Advance HRI understanding, state of the art or general knowledge
      - value: Typical evidence
        label: Deep, complete and interdisciplinary archival support
      - value: Strong fit
        label: Theory · method · longitudinal · synthesis · complete HRI analysis
      - value: Recheck fit
        label: Small system report or narrow increment without general HRI value
    position_note: >-
      ACM의 공식 소개는 robotics, computer science, engineering, design, behavioral and social sciences 전반의 submission을 열고,
      broad interest와 여러 독자가 이해할 수 있는 글을 우선한다고 밝힌다. Interdisciplinary breadth와 intelligibility가 함께 요구된다.
    taste_intro: >-
      좋은 THRI article은 <strong>여러 결과를 더하는 데서 끝나지 않고 HRI community가 다시 인용할 framework·evidence·design knowledge로 묶는다</strong>.
    matrix:
      - axis: Problem
        sound: Conference study를 더 큰 표본으로 반복
        shaped: 어떤 unresolved HRI knowledge gap을 archival evidence로 닫는지 정의
      - axis: Claim
        sound: 더 많은 condition에서 effect를 확인
        shaped: Theory·method·design·system·human knowledge 중 durable contribution을 명시
      - axis: Evidence
        sound: Study 수와 appendix가 증가
        shaped: Triangulation·replication·longitudinal·cross-context evidence가 한 claim을 완결
      - axis: Framing
        sound: Conference보다 긴 결과를 보고
        shaped: Broad HRI audience가 이해하고 재사용할 archival reference point가 첫 페이지에 보임
    framing:
      diffuse:
        sample: “기존 HRI study에 condition과 참가자를 추가해 더 유의한 결과를 얻었다.”
        explain: Evidence는 늘었지만 어떤 general HRI knowledge가 새로 완결됐는지 약하다.
      shaped:
        sample: “세 deployment를 통해 socially appropriate assistance의 context-sensitive framework를 구축하고 measure와 design implication을 검증한다.”
        explain: Multiple evidence가 framework, method, general knowledge를 하나의 archival claim으로 만든다.
    lessons:
      - title: Extension보다 archival claim을 먼저 쓴다
        text: 무엇을 더 했는지가 아니라 HRI understanding을 어떻게 완결했는지 설명한다.
      - title: Broad interest를 번역한다
        text: Technical·social·design reader가 같은 contribution을 이해할 수 있게 jargon을 연결한다.
      - title: Evidence depth를 claim에 맞춘다
        text: Multiple study가 필요할 수도 있지만 theory나 method paper는 다른 validation이 적절할 수 있다.
      - title: Field와 time을 knowledge로 만든다
        text: Longitudinal deployment를 anecdote가 아니라 relationship·adaptation·practice insight로 정리한다.
      - title: Review와 synthesis도 contribution이다
        text: 명확한 method와 새로운 taxonomy·gap·agenda를 제공해야 한다.
    submit:
      big: Archival HRI
      small: 몇 년 뒤에도 무엇이 reference point로 남는가?
      items:
        - <b>Claim:</b> theory · method · design · system · general knowledge
        - <b>Evidence:</b> deep · complete · triangulated · longitudinal
        - <b>Audience:</b> broad interdisciplinary HRI
        - <b>Boundary:</b> IJSR sociality and T-RO robotics advance
    final:
      big: >-
        가장 간결하게 말하면, <strong>THRI는 HRI community 전체가 오래 사용할 theory·method·evidence·system knowledge의 archival home</strong>이다.
      small: >-
        좋은 article은 conference보다 길어서가 아니라, 하나의 HRI claim을 더 넓고 깊고 오래 남게 완결한다.
    spectrum_intro: >-
      아래 질문은 THRI 공식 scope와 author guidance를 바탕으로 archival HRI research unit을 보여주는 편집 예시다.
    hero_question:
      tag: Framework
      title: Socially appropriate robot assistance를 context와 user capability에 따라 설명하는 general framework는 무엇인가?
      text: 여러 study와 system evidence를 하나의 durable HRI knowledge claim으로 묶는 질문.
    questions:
      - tag: Method
        title: LLM 기반 HRI 연구는 model·prompt·failure를 어떻게 보고해야 하는가?
        text: Reproducibility와 reporting practice를 바꾸는 archival method 질문.
      - tag: Longitudinal
        title: 가정에서 robot relationship은 novelty 이후 어떻게 적응·해체되는가?
        text: 시간과 context를 general HRI knowledge로 만드는 질문.
      - tag: Theory
        title: Trust·agency·social presence를 어떤 관계 model로 통합할 수 있는가?
        text: Construct와 mechanism을 재정의하는 이론 질문.
      - tag: Complete system
        title: HRI capability와 실제 interaction outcome을 end-to-end로 어떻게 연결할까?
        text: Component와 user behavior를 함께 분석하는 system 질문.
      - tag: Review
        title: Older adults를 위한 robot 연구는 어떤 population과 outcome을 빠뜨렸는가?
        text: Systematic evidence와 research agenda를 만드는 synthesis 질문.
      - tag: Cross-context
        title: Physical·virtual embodiment effect는 task와 culture를 넘어 유지되는가?
        text: 여러 context를 가로지르는 archival comparison 질문.
    selection_note: >-
      THRI의 review duration, acceptance rate, fee와 impact metric은 시점과 article type에 따라 변한다. Submission decision은 current author guideline을 다시 확인한다.
    sources:
      - label: ACM Transactions on Human-Robot Interaction
        url: "https://dl.acm.org/journal/thri"
      - label: ACM THRI Author Guidelines
        url: "https://dl.acm.org/journal/thri/author-guidelines"
      - label: ACM — Historical THRI Scope Announcement (2017)
        url: "https://www.acm.org/binaries/content/assets/press-releases/2017/july/thri1.pdf"

  - slug: ijsr
    order: 10
    group: publication
    badge: IJSR
    name: International Journal of Social Robotics
    full_name: International Journal of Social Robotics
    meta: Social Robotics Archival Journal · Springer Nature
    accent: "#9a5362"
    accent_dark: "#713846"
    accent_soft: "#f9ecef"
    hub_intro: >-
      IJSR을 “social robot user study를 싣는 비기술 저널”로 이해하면 공식 scope를 놓친다.
      이 journal은 core technology, system integration, aesthetic design, application, social implication을 폭넓게 열고,
      <strong>robot–human–environment interaction을 사회·문화적 역할 안에서</strong> 본다.
    hub_detail: >-
      AI·control·social navigation 같은 technical paper부터 psychology, ethics, philosophy, ethnography, care·education deployment까지 가능하다.
      개별 논문이 모든 축에 기여할 필요는 없지만 social robot이 연구의 중심이어야 한다.
    definition: >-
      Social robot의 enabling technology, behavior, relationship, design, application, ethics와 societal consequence를 폭넓게 보존하는 interdisciplinary archival journal
    thesis: >-
      IJSR에서 중요한 것은 method의 기술성 여부가 아니라
      <strong>social robot의 capability·role·relationship·사회적 맥락 중 무엇을 전진시키는가</strong>다.
    thesis_note: >-
      공식 scope는 engineering and computing뿐 아니라 arts, social science, ethics and philosophy를 함께 포함한다.
      이 breadth는 method의 다양성을 뜻하며 social framing이 없어도 된다는 뜻은 아니다.
    facts:
      - value: Social Robotics
        label: Robot–human–environment interaction을 social and cultural role 안에서 연구
      - value: Tech → Society
        label: Core technology · integration · design · application · social implication
      - value: Diverse Methods
        label: Engineering · experiment · qualitative · ethnography · philosophy
      - value: Applied Contexts
        label: Care · health · education · home · work · public space
    identity:
      - title: Primary knowledge unit
        text: >-
          Social behavior, cognition, affect, relationship, acceptance, navigation, care·education application 또는 ethics가
          social robot이라는 actor와 그 환경을 어떻게 이해·설계·배치하게 만드는지 다룬다.
      - title: Editor와 reviewer가 보는 것
        text: >-
          Social robotics에 original, rigorous and relevant contribution이 있는지,
          chosen technical·human-science·design method가 social claim과 context를 충분히 지지하는지를 본다.
    scope:
      - title: Enabling technology
        items:
          - Social perception and cognition
          - Affect · dialogue · adaptive behavior
          - Social navigation and planning
          - AI · control · system integration
      - title: People · relationship
        items:
          - Psychology and human factors
          - Acceptance · trust · attachment
          - Worker and community perspective
          - Long-term relational autonomy
      - title: Design · society
        items:
          - Aesthetic and interactive design
          - Care · health · education
          - Ethics · philosophy · social impact
          - Arts and cultural context
    rule:
      label: IJSR의 기본 단위
      text: >-
        <strong>Contribution이 social robotics 자체 또는 그 enabling technology에 직접 연결</strong>되어야 한다.
        Role·context 분석은 중요한 경로지만 모든 core-technology paper의 필수 형식은 아니다. Generic robot algorithm으로 끝나면 T-RO·RA-L·robotics conference가 더 직접적일 수 있다.
    position:
      - label: Primary claim
        text: Social robot의 technology, behavior, relationship, design, application or societal understanding.
      - label: Core audience
        text: Social robotics, HRI, psychology, design, ethics, application and robotics researcher.
      - label: Evidence
        text: Technical analysis, experiment, field study, qualitative work, ethnography, design research and philosophy.
      - label: Archival lens
        text: Social role과 context를 충분히 설명하고 method가 그 claim에 맞는가.
      - label: Strong signal
        text: Social robot이어야 하는 이유가 problem, result, implication 전체에 남는다.
      - label: Weak signal
        text: Social이라는 label만 있고 generic control·AI·UX result로 끝난다.
    neighbors: >-
      THRI는 HRI 전반의 broad archival knowledge를 받고, T-RO는 major robotics advance를 중심에 둔다.
      ICSR은 social robotics의 conference counterpart에 가까운 독자층을 제공한다.
    boundary: >-
      IJSR이 THRI보다 method가 좁다는 뜻은 아니다. 오히려 technical부터 ethnographic work까지 매우 넓지만,
      social-robotics relevance가 central해야 한다는 thematic boundary가 더 분명하다.
    snapshot:
      - value: Official scope
        label: Core technologies through systems, design, applications and social implications
      - value: Typical evidence
        label: Method varies widely; social-robot relevance must remain central
      - value: Strong fit
        label: Social capability, relationship, role, ethics or real deployment
      - value: Recheck fit
        label: Generic robotics result with superficial social framing
    position_note: >-
      공식 topic list에는 affective·cognitive science, HRI, safety, learning, roboethics, acceptance, design,
      intelligent control·AI, arts, healthcare, human factors와 socially-aware navigation이 함께 명시된다.
    taste_intro: >-
      좋은 IJSR article은 <strong>social이라는 단어를 감성적 수식어로 쓰지 않고 role·norm·relationship·culture·power의 concrete mechanism으로 만든다</strong>.
    matrix:
      - axis: Problem
        sound: Social robot application을 구현·평가
        shaped: 어떤 social role·relationship·norm·context gap을 다루는지 정의
      - axis: Claim
        sound: Acceptance·performance가 향상
        shaped: Technology·behavior·design·societal understanding 중 archival contribution을 명시
      - axis: Evidence
        sound: 한 method의 결과를 제시
        shaped: Technical·behavioral·qualitative evidence가 social claim에 적절하고 limitation이 투명
      - axis: Framing
        sound: Robot과 사용자를 소개
        shaped: Social robotics literature와 실제 application·society consequence가 첫 페이지에 보임
    framing:
      diffuse:
        sample: “Warehouse robot의 path를 최적화하고 worker satisfaction을 측정했다.”
        explain: Optimization과 study는 보이지만 social role과 worker-centered consequence가 아직 약하다.
      shaped:
        sample: “Worker가 robot route와 priority를 협상할 수 있는 composite cost를 설계하고 ergonomics·agency·throughput trade-off를 field context에서 분석한다.”
        explain: Technical planning, social relation, workplace consequence가 archival story로 연결된다.
    lessons:
      - title: Social을 역할과 norm으로 정의한다
        text: Likeability만이 아니라 agency, care, labor, distance, relationship을 구체화한다.
      - title: Method breadth를 강점으로 쓴다
        text: Technical·qualitative·critical method 중 claim을 가장 잘 검증하는 것을 선택한다.
      - title: Application context를 충분히 기술한다
        text: 병원·가정·학교·창고의 institution과 stakeholder가 result를 어떻게 만드는지 본다.
      - title: 기술과 사회를 억지로 모두 주장하지 않는다
        text: 한 축의 contribution을 선명히 하되 social-robot relevance를 직접 연결한다.
      - title: 장기 consequence를 고려한다
        text: Acceptance, dependency, worker control, privacy, inequality, cultural assumption을 limitation에 포함한다.
    submit:
      big: Social context
      small: Social robot의 어떤 capability·role·relationship을 오래 남기는가?
      items:
        - <b>Axis:</b> technology · behavior · design · application · society
        - <b>Context:</b> role · stakeholder · institution · culture
        - <b>Method:</b> technical · empirical · qualitative · critical
        - <b>Boundary:</b> THRI broad HRI and T-RO robotics advance
    final:
      big: >-
        가장 간결하게 말하면, <strong>IJSR은 social robot이 어떻게 작동하고 관계 맺고 사회에 놓이는지를 폭넓게 보존하는 archival journal</strong>이다.
      small: >-
        좋은 article은 technical인지 qualitative인지보다, social robot이어야 하는 이유와 그 contribution이 처음부터 끝까지 일치한다.
    spectrum_intro: >-
      아래 질문은 IJSR official scope와 topic list의 method breadth를 바탕으로 구성한 social robotics spectrum 예시다.
    hero_question:
      tag: Worker-centered robotics
      title: Warehouse robot의 효율과 worker agency·ergonomics를 하나의 system에서 어떻게 조정할까?
      text: Technical planning과 workplace relation·power·human factor를 social robotics question으로 묶는 예시.
    questions:
      - tag: Social navigation
        title: Group·norm·culture에 따라 navigation cost를 어떻게 바꿔야 하는가?
        text: Planning과 social behavior를 연결하는 technical 질문.
      - tag: Relational autonomy
        title: Meal-assistance robot은 도움과 사용자의 control을 어떻게 협상하는가?
        text: Care practice와 relationship을 ethnographic lens로 보는 질문.
      - tag: Acceptance
        title: Novelty가 사라진 뒤에도 어떤 social role이 robot 사용을 유지하는가?
        text: Longitudinal acceptance와 role expectation 질문.
      - tag: Ethics
        title: Vulnerable user에게 social deception은 언제 정당화될 수 있는가?
        text: Transparency, benefit, consent, moral agency 질문.
      - tag: Design
        title: Morphology와 expressive behavior가 social identity를 어떻게 만든다?
        text: Aesthetic design과 cultural interpretation 질문.
      - tag: System integration
        title: Social perception·dialogue·planning을 실제 deployment에서 어떻게 통합할까?
        text: Enabling technology를 robust social capability로 만드는 질문.
    selection_note: >-
      Journal homepage의 metric과 review time은 변동 가능하며, median first decision은 external review duration과 같은 개념이 아니다. Current author information을 확인한다.
    sources:
