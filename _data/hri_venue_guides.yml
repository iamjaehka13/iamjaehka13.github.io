    definition: >-
      혁신적인 robotics·automation idea와 application result를 짧고 빠른 fully reviewed archival Letter로 공개하는 electronic-only IEEE RAS journal
    thesis: >-
      RA-L에 맞는 연구는 긴 archival story의 일부가 아니라,
      <strong>compact한 범위 안에서 이미 완결되고 재사용 가능한 original robotics advance</strong>다.
    thesis_note: >-
      Official guidance는 originality와 timeliness를 maturity보다 더 앞세우는 Letters의 성격을 설명한다.
      HRI도 명시 keyword 영역이지만 primary result는 human study의 존재가 아니라 robotics·automation contribution이어야 한다.
    facts:
      - value: 6 + 2 Pages
        label: Figures·references 포함 6쪽, 유료 초과분 최대 2쪽, hard max 8쪽
      - value: ≤ 6 Months
        label: Submission부터 final decision까지 보장되는 최대 기간
      - value: Year-round
        label: Conference deadline과 무관하게 연중 투고
      - value: Journal + Talk
        label: 조건을 충족하면 acceptance 후 270일 안에 한 eligible RAS conference에서 발표 가능
    identity:
      - title: Primary knowledge unit
        text: >-
          시의성 있는 robotics·automation idea, theory, algorithm, system 또는 application result가
          짧은 형식 안에서 독립된 original contribution으로 완결된다.
      - title: Reviewer가 보는 것
        text: >-
          Contribution과 significance가 분명한지, technically sound한지, 관련 연구를 적절히 다루는지,
          글과 evidence가 제한된 분량 안에서 claim을 지지하는지 본다.
    scope:
      - title: Human-centered robotics
        items:
          - Human–robot collaboration and teaming
          - Physical · social · multimodal HRI
          - Human-aware motion planning
          - Trust · safety · human-in-the-loop
      - title: Robotics methods
        items:
          - Perception · planning · control
          - Learning · estimation · optimization
          - Mechanism and robot design
          - Verification and benchmarking
      - title: Systems · applications
        items:
          - Integrated robot systems
          - Field and service robotics
          - Assistive · medical · industrial robotics
          - Concise application case study
    rule:
      label: 편집적 판단 · RA-L의 기본 단위
      text: >-
        <strong>짧아서 덜 완성된 paper가 아니라, 짧은 범위 안에서 완결되는 original robotics result</strong>가 필요하다.
        Human outcome이 primary knowledge라면 HRI·THRI를, 더 성숙하고 깊은 archival treatment가 필요하면 T-RO를 다시 본다.
    position:
      - label: Primary claim
        text: Timely하고 concise하게 완결되는 original robotics or automation advance.
      - label: Core audience
        text: 새로운 robotics method·system·application result를 빠르게 읽고 재사용하려는 RAS community.
      - label: Evidence
        text: Theory, analysis, benchmark, simulation, robot experiment, system demonstration 중 compact claim을 지지하는 조합.
      - label: Format lens
        text: Stable final manuscript인가, 아니면 아직 conference feedback을 거쳐 크게 진화해야 하는가.
      - label: Strong signal
        text: 한 가지 robotics novelty와 그 evidence가 6–8쪽 안에서 독립적으로 닫힌다.
      - label: Weak signal
        text: 긴 story를 잘라 핵심 가정·비교·failure evidence가 빠졌거나, human insight가 가장 큰 결과다.
    neighbors: >-
      T-RO는 더 mature하고 in-depth한 archival treatment를, ICRA·IROS는 deadline 기반 conference feedback과 community presentation을 제공한다.
      HRI·THRI는 robotics novelty보다 interaction knowledge가 primary일 때 더 직접적이다.
    boundary: >-
      RA-L official guidance는 Letters를 rapid하고 concise한 report, T-RO·T-ASE를 더 mature하고 깊은 treatment로 구분한다.
      Conference presentation option은 journal review를 conference review로 바꾸지 않으며, 논문은 conference proceedings에 중복 출판되지 않는다.
    snapshot:
      - value: Official scope
        label: Timely, concise innovative robotics and automation results
      - value: Review model
        label: Double-anonymous journal review with at least two independent reviewers
      - value: Strong fit
        label: Stable compact robotics story with clear novelty and sufficient evidence
      - value: Recheck fit
        label: In-depth archival treatment or interaction knowledge is the primary result
    position_note: >-
      RA-L keyword taxonomy에는 Human-Robot Interaction이 별도 subject area로 있으며 collaboration, teaming, multimodal perception,
      physical·social HRI, safety와 trust를 포함한다. Scope inclusion과 venue fit은 다르므로, HRI topic이어도 primary claim이 robotics result인지 확인한다.
    taste_intro: >-
      좋은 RA-L paper는 <strong>한 가지 timely robotics contribution, 그것을 반증할 수 있는 evidence, 적용 범위와 한계</strong>가
      짧은 형식 안에서 같은 방향을 가리킨다.
    matrix:
      - axis: Problem
        sound: HRI system 전체의 여러 문제를 한 번에 해결
        shaped: 현재 robotics method가 막히는 하나의 timely bottleneck을 좁혀 정의
      - axis: Claim
        sound: Conference paper를 확장해 더 많은 결과를 추가
        shaped: 독립적으로 인용·재사용 가능한 original method·system·application result 하나를 명시
      - axis: Evidence
        sound: 제한된 지면 때문에 중요한 비교와 failure를 생략
        shaped: Claim에 필요한 baseline·ablation·analysis·robot evidence를 우선하고 범위를 정직하게 제한
      - axis: Format
        sound: 긴 Transactions story를 압축
        shaped: 처음부터 6–8쪽 안에서 완결되는 stable manuscript로 설계
    framing:
      diffuse:
        sample: “새 shared-autonomy system을 만들고 여러 task에서 성능과 사용자 만족도를 평가했다.”
        explain: System 범위는 넓지만 concise한 robotics novelty와 필수 evidence가 무엇인지 아직 흐리다.
      shaped:
        sample: “사용자 correction에서 intent uncertainty를 갱신하는 shared-control update를 제안하고, compact analysis와 real-robot task에서 recovery gain과 failure boundary를 검증한다.”
        explain: 한 가지 timely robotics result와 claim-aligned evidence가 Letters 크기로 닫힌다.
    lessons:
      - title: 한 paper에 한 technical spine을 둔다
        text: 여러 module을 나열하기보다 가장 재사용 가능한 robotics contribution을 중심축으로 삼는다.
      - title: Concise와 incomplete를 구분한다
        text: 범위는 좁혀도 핵심 baseline, limitation, failure evidence는 생략하지 않는다.
      - title: Stable manuscript인지 확인한다
        text: 큰 conceptual change가 남았다면 conference feedback 또는 더 긴 연구 주기가 먼저일 수 있다.
      - title: Conference option을 목적과 혼동하지 않는다
        text: 발표 기회는 부가 경로이며 RA-L의 primary identity는 journal publication이다.
      - title: HRI topic과 contribution을 분리한다
        text: Human-centered keyword에 들어가도 interaction insight가 중심이면 HRI·THRI와 독자를 비교한다.
    submit:
      big: Compact, complete, timely
      small: 이 robotics result는 6–8쪽 안에서 독립적으로 닫히는가?
      items:
        - <b>Novelty:</b> one original robotics or automation result
        - <b>Evidence:</b> claim을 닫는 최소 충분 조합
        - <b>Stability:</b> major conceptual revision이 필요 없는 manuscript
        - <b>Boundary:</b> T-RO · ICRA/IROS · HRI/THRI와 비교
    final:
      big: >-
        가장 간결하게 말하면, <strong>RA-L은 timely한 robotics advance를 짧지만 완결된 journal record로 빠르게 남기는 venue</strong>다.
      small: >-
        좋은 RA-L HRI paper는 human-centered setting을 사용하되, 독자가 가져가는 가장 큰 결과가 compact하고 original한 robotics contribution임을 보여준다.
    spectrum_intro: >-
      아래 질문은 RA-L official HRI keyword와 concise Letters 형식을 연결한 편집 예시다. Keyword에 포함된다는 사실만으로 적합성이 자동 결정되지는 않는다.
    hero_question:
      tag: Shared autonomy
      title: 한 번의 human correction으로 robot policy를 안전하게 갱신하는 compact method는 무엇인가?
      text: Original update rule, 제한된 claim, analysis와 real-robot evidence가 하나의 Letters story로 닫히는 질문.
    questions:
      - tag: Human-aware planning
        title: 사람의 reachability uncertainty를 짧은 horizon planner에 어떻게 반영할까?
        text: 명확한 planning novelty와 compact evaluation이 중심인 질문.
      - tag: Physical HRI
        title: Contact 변화에 즉시 적응하는 impedance update를 안정성 조건과 함께 만들 수 있는가?
        text: Concise control result와 physical interaction evidence를 잇는 질문.
      - tag: Multimodal HRI
        title: Gesture와 speech가 충돌할 때 intent belief를 어떻게 갱신할까?
        text: Multimodal fusion의 robotics advance를 좁게 완결하는 질문.
      - tag: Safety
        title: Human-in-the-loop recovery에서 online safety constraint를 어떻게 보장할까?
        text: Verification 또는 control result가 primary인 질문.
      - tag: Social navigation
        title: 짧은 interaction history로 personal space model을 adaptation할 수 있는가?
        text: Generalizable algorithm과 robot evidence를 중심에 둔 질문.
      - tag: Integrated system
        title: 기존 component를 묶어도 어떤 integration insight가 original result가 되는가?
        text: Application case가 재사용 가능한 system knowledge로 닫히는지 묻는 질문.
    selection_note: >-
      Page limit, review schedule, conference-presentation eligibility와 transfer window는 바뀔 수 있다. Submission 전 current RA-L author instructions와 FAQ를 확인한다.
    sources:
      - label: IEEE Robotics and Automation Letters — Overview and Scope
        url: "https://www.ieee-ras.org/publications/ieee-robotics-and-automation-letters/"
      - label: RA-L — Information for Authors
        url: "https://www.ieee-ras.org/publications/ra-l/ra-l-information-for-authors/"
      - label: RA-L — Information for Reviewers
        url: "https://www.ieee-ras.org/publications/ra-l/ra-l-information-for-reviewers/"
      - label: RA-L — Official Keywords
        url: "https://www.ieee-ras.org/publications/ra-l/ra-l-information-for-authors/keywords-5/"
      - label: RA-L — Frequently Asked Questions
        url: "https://www.ieee-ras.org/publications/ra-l/faq/"

  - slug: t-ro
    order: 11
    group: publication
    badge: T-RO
    name: IEEE Transactions on Robotics
    full_name: IEEE Transactions on Robotics
    meta: Flagship Robotics Archival Journal · IEEE RAS
    accent: "#2e7767"
    accent_dark: "#205548"
    accent_soft: "#e9f5f1"
    hub_intro: >-
      T-RO를 “사람 연구는 받지 않는 순수 robotics 저널”로 이해하면 official scope를 잘못 읽게 된다.
      Robots and Humans 영역에는 physical·cognitive HRI, social robotics, learning from humans, robo-ethics가 포함된다.
      다만 paper는 <strong>robotics state of the art의 major advance</strong>여야 한다.
    hub_detail: >-
      Theory, design, experiment, analysis, algorithm, integration, application case study가 모두 가능하다.
      HRI 맥락도 열려 있지만 primary claim이 사람의 experience·relationship만이라면 THRI·IJSR의 독자가 더 직접적이다.
    definition: >-
      Robotics 전 영역에서 theory, design, algorithms, experiments, systems와 applications의 major state-of-the-art advance를 archival record로 남기는 IEEE RAS journal
    thesis: >-
      T-RO의 HRI article은 사람이 등장해서가 아니라
      <strong>그 HRI problem을 통해 robotics라는 field의 state of the art를 실질적으로 바꾼다</strong>.
    thesis_note: >-
      Physical·cognitive HRI, social robotics, human-robot learning도 가능하지만
      original·significant한 robotics result와 claim에 맞는 충분한 evidence가 broad robotics reader에게 substantive advance로 읽혀야 한다.
    facts:
      - value: Major Advance
        label: All areas of robotics에서 state of the art의 substantive advance
      - value: Broad Forms
        label: Theory · design · experiments · analysis · algorithms · integration · case study
      - value: Robots + Humans
        label: Physical/cognitive HRI · social robotics · learning from humans · robo-ethics
      - value: Archival Depth
        label: Original·significant robotics result와 오래 남을 만큼 complete한 evidence
    identity:
      - title: Primary knowledge unit
        text: >-
          Control, planning, estimation, mechanism, learning, system integration 또는 robotics theory가
          HRI setting을 통해 general robotics state of the art에 major advance를 만든다.
      - title: Editor와 reviewer가 보는 것
        text: >-
          Scope, originality, technical significance, correctness, evidence completeness와 broad robotics relevance를 본다.
          Clear state-of-the-art advance가 없으면 full review 전 editorial rejection이 가능하다.
    scope:
      - title: Robots and humans
        items:
          - Physical and cognitive HRI
          - Human–robot collaboration
          - Social and assistive robotics
          - Learning from and with humans
      - title: Robotics methods
        items:
          - Control · planning · estimation
          - Perception · learning · AI
          - Mechanism and design
          - Safety · verification · theory
      - title: Archival systems
        items:
          - System integration
          - Experimental studies and system validation
          - Comparative analysis
          - Application case study
    rule:
      label: T-RO의 기본 단위
      text: >-
        <strong>HRI context를 넘어 robotics에 남는 major advance</strong>가 있어야 한다.
        Specific application은 best current practice를 상세한 특성과 성능으로 입증하는 경로도 가능하다. 사람의 perception·trust·relationship이 primary result이면 THRI·IJSR가 더 자연스럽다.
    position:
      - label: Primary claim
        text: Fundamental or major state-of-the-art advance in robotics, including HRI-relevant areas.
      - label: Core audience
        text: Broad robotics researcher across theory, methods, systems, mechanisms and applications.
      - label: Evidence
        text: Claim에 따라 theory, analysis, algorithms, experiments, system integration 또는 application validation 중 적절한 조합.
      - label: Archival lens
        text: Conference-size novelty를 넘어 robotics reference point가 될 technical depth가 있는가.
      - label: Strong signal
        text: HRI problem에서 나온 method가 general robotics capability와 state of the art를 바꾼다.
      - label: Weak signal
        text: Technical component는 기존이고 human study insight가 가장 큰 contribution이다.
    neighbors: >-
      THRI는 broad HRI knowledge, IJSR은 social robot의 role과 context를 중심에 둔다.
      RA-L은 concise and timely robotics innovation에 더 맞을 수 있고, T-RO는 archival major advance를 요구한다.
    boundary: >-
      T-RO가 user study나 social robotics를 배제하는 것은 아니다. Official Robots and Humans keyword가 이를 명시한다.
      경계는 method가 아니라 primary archival claim이 robotics advance인지에 있다.
    snapshot:
      - value: Official scope
        label: Major advances in the state of the art in all areas of robotics
      - value: Typical evidence
        label: Claim-appropriate theoretical, analytical, experimental, system or application evidence
      - value: Strong fit
        label: HRI-derived method or system that advances general robotics
      - value: Recheck fit
        label: Human experience or social relationship is the main result
    position_note: >-
      T-RO는 2025년부터 double-anonymous review를 운영한다. Current author guideline과 scope에는 Robots and Humans topic이 포함되며,
      fundamental contribution 또는 major state-of-the-art advance가 분명하지 않은 paper는 editorial stage에서 걸러질 수 있다.
    taste_intro: >-
      좋은 T-RO HRI article은 <strong>사람을 어려운 environment variable로 다루는 것을 넘어 그 문제에서 새로운 robotics principle과 complete evidence를 만든다</strong>.
    matrix:
      - axis: Problem
        sound: HRI system을 더 큰 scale로 평가
        shaped: Existing robotics state of the art가 해결하지 못하는 technical bottleneck을 정의
      - axis: Claim
        sound: System performance와 user outcome 향상
        shaped: Fundamental method·theory·mechanism·integration advance와 general robotics consequence를 명시
      - axis: Evidence
        sound: 한 benchmark와 user study
        shaped: Theory·baseline·ablation·experiment·real robot·failure·cross-condition 중 claim에 필요한 조합이 archival claim을 완결
      - axis: Framing
        sound: Human-aware application을 소개
        shaped: Broad robotics reader가 state-of-the-art difference를 첫 페이지에서 이해
    framing:
      diffuse:
        sample: “새 assistive robot을 구현하고 사용자 만족도와 task success를 평가했다.”
        explain: Application은 중요하지만 major robotics advance가 무엇인지 아직 약하다.
      shaped:
        sample: “Unknown human impedance와 intent를 joint belief로 추정하는 safe shared-control framework를 제안하고 stability, generalization, real assistive manipulation에서 검증한다.”
        explain: HRI context가 theory, method, system evidence를 통해 major robotics contribution으로 변환된다.
    lessons:
      - title: Major advance를 한 문장으로 쓴다
        text: 더 큰 experiment보다 robotics state of the art가 정확히 무엇 때문에 바뀌는지 명시한다.
      - title: General robotics consequence를 보여준다
        text: 한 assistive application 밖에서 method·theory·system lesson이 어디까지 유지되는지 쓴다.
      - title: Evidence를 archival depth로 설계한다
        text: Theory, baseline, failure, real robot, cross-condition을 claim에 필요한 만큼 완결한다.
      - title: Human study의 역할을 분리한다
        text: Technical validity·utility·safety evidence인지 human knowledge contribution인지 혼동하지 않는다.
      - title: THRI·IJSR와 독자를 비교한다
        text: 같은 result라도 robotics reader와 HRI/social-robotics reader 중 누가 primary인지 확인한다.
    submit:
      big: Major robotics advance
      small: HRI problem을 통해 state of the art가 어떻게 바뀌는가?
      items:
        - <b>Advance:</b> theory · method · mechanism · system integration
        - <b>Generality:</b> beyond one user study or application
        - <b>Evidence:</b> claim-appropriate theory · analysis · experiment · integration · application validation
        - <b>Boundary:</b> THRI · IJSR · RA-L reader and research unit
    final:
      big: >-
        가장 간결하게 말하면, <strong>T-RO의 HRI는 사람과 함께 작동하는 robot을 통해 robotics state of the art의 major advance를 만드는 archival research</strong>다.
      small: >-
        좋은 article은 HRI가 중요한 application이라는 주장에 머물지 않고, 그 application이 요구한 새로운 robotics principle을 깊고 완결되게 증명한다.
    spectrum_intro: >-
      아래 질문은 T-RO official Robots and Humans scope를 major robotics advance의 관점으로 바꾼 편집 예시다.
    hero_question:
      tag: Safe shared control
      title: Unknown human dynamics와 intent를 함께 추정하면서 stability를 보장할 수 있는가?
      text: HRI context에서 fundamental estimation·control advance와 archival evidence를 만드는 질문.
    questions:
      - tag: Physical HRI
        title: Variable human impedance에서 안전성과 performance를 동시에 보장하는 control은 무엇인가?
        text: Theory, stability, real interaction을 연결하는 질문.
      - tag: Human-aware planning
        title: Human belief와 capability uncertainty를 planning guarantee에 어떻게 넣을까?
        text: Estimation, planning, formal property 질문.
      - tag: Learning from humans
        title: Human demonstration의 bias를 넘어 다른 embodiment로 generalize할 수 있는가?
        text: Robot learning과 general robotics relevance 질문.
      - tag: Assistive system
        title: Perception부터 shared control까지 end-to-end safety를 어떻게 검증할까?
        text: Complete system integration과 failure analysis 질문.
      - tag: Social robotics
        title: Social navigation rule을 scalable planning algorithm으로 만들 수 있는가?
        text: Social context를 major robotics method로 변환하는 질문.
      - tag: Robo-ethics
        title: Human control과 value constraint를 robot decision architecture에 어떻게 formalize할까?
        text: Ethics concern을 verifiable robotics design으로 연결하는 질문.
    selection_note: >-
      T-RO의 metric과 editorial policy는 변할 수 있다. Submission 전 current Information for Authors, scope keywords, double-anonymous requirement를 확인한다.
    sources:
      - label: IEEE Transactions on Robotics — Overview
        url: "https://www.ieee-ras.org/publications/t-ro/"
      - label: T-RO — Information for Authors and Scope
        url: "https://www.ieee-ras.org/publications/t-ro/t-ro-information-for-authors/"
      - label: T-RO — Information for Associate Editors
        url: "https://www.ieee-ras.org/publications/t-ro/information-for-associate-editors/"

  - slug: chi
    order: 2
    group: conference
    badge: CHI
    name: ACM CHI
    full_name: ACM Conference on Human Factors in Computing Systems
    meta: Flagship HCI Conference · ACM SIGCHI
    accent: "#4b63a8"
    accent_dark: "#2e407d"
    accent_soft: "#edf0fb"
    hub_intro: >-
      CHI를 “사용성 평가를 하는 곳”으로만 보면 HRI paper의 가능성을 지나치게 좁힌다.
      CHI는 interface artifact, user understanding, system, method, theory, vision까지 폭넓게 받지만,
      모든 경우 primary criterion은 <strong>original contribution to HCI</strong>다.
    hub_detail: >-
      Robot이 등장해도 논문이 끝난 뒤 HCI researcher가 사용할 interaction capability, user benefit,
      socio-technical insight 또는 reusable design knowledge가 남아야 한다. System performance도 가능하지만
      성능 수치만으로 끝나지 않고 인간 관점의 의미가 보여야 한다.
    definition: >-
      Robot을 포함한 interactive technology를 통해 original contribution to HCI를 만드는 flagship conference
    thesis: >-
      CHI의 질문은 “robot이 좋아졌는가?”에서 끝나지 않는다.
      <strong>그 변화가 HCI community에 어떤 새로운 interaction capability와 human knowledge를 남기는가</strong>를 묻는다.
    thesis_note: >-
      CHI 2026은 contribution 형태를 artifact, users, systems, methods, theory, vision으로 넓게 열어 두며,
      subcommittee 선택도 topic이 아니라 core contribution을 어떤 lens로 평가받을지 정하는 과정으로 설명한다.
    facts:
      - value: HCI First
        label: 모든 paper의 primary criterion은 original contribution to HCI
      - value: 6,730 Submissions
        label: CHI 2026 completed submissions의 공식 집계
      - value: 25.3%
        label: CHI 2026 conditional acceptance 전체 비율, subcommittee별 차이 존재
      - value: Many Forms
        label: Artifact · users · systems · method · theory · vision contribution
    identity:
      - title: Primary knowledge unit
        text: >-
          Robot interface, embodied interaction, user practice, accessibility, collaboration, organization 또는 field deployment가
          HCI 전반에 재사용 가능한 지식으로 정리되어야 한다. Robot은 artifact일 수 있지만 인간 관점은 중심에 남는다.
      - title: Reviewer가 먼저 보는 것
        text: >-
          Originality, significance, validity, research quality, clarity와 함께 왜 이 결과를 HCI community가 읽어야 하는지를 본다.
          User study 유무가 아니라 contribution에 적절한 validation이 있는지가 중요하다.
    scope:
      - title: Interaction · artifact
        items:
          - Interface and interaction technique
          - Embodied and tangible computing
          - Tool · system · infrastructure
          - Accessibility and inclusive design
      - title: People · practice
        items:
          - User understanding and experience
          - Group and organizational practice
          - Trust · ethics · social impact
          - Field and longitudinal study
      - title: Knowledge · method
        items:
          - HCI theory and conceptual framing
          - Research and design method
          - Dataset and benchmark for HCI
          - Innovation and vision
    rule:
      label: 편집적 판단 · CHI의 기본 단위
      text: >-
        Robot-specific embodiment와 interaction이 그대로 중심이어도 된다. 공식 기준은 다른 artifact로 교체 가능한지가 아니라,
        <strong>명확한 original HCI contribution과 그 contribution에 적절한 validation이 있는가</strong>다.
    position:
      - label: Primary claim
        text: 사람과 interactive technology에 관한 original HCI contribution.
      - label: Core audience
        text: HCI researcher, designer, social scientist, computing and interactive-system researcher.
      - label: Evidence
        text: Qualitative·quantitative study, system evaluation, deployment, artifact demonstration, theory and method validation.
      - label: Review lens
        text: 선택한 subcommittee가 논문의 core contribution을 판단할 적절한 expertise를 갖는지.
      - label: Strong signal
        text: Robot-specific이든 더 넓게 적용되든, HCI contribution과 human viewpoint가 명확하다.
      - label: Weak signal
        text: 사람은 algorithm 성능을 확인하는 역할뿐이며 human viewpoint가 결론에서 사라진다.
    neighbors: >-
      HRI는 robot-specific interaction을 중심으로 일반화하고, HAI는 physical·virtual agent를 함께 본다.
      ICRA·IROS·RSS·CoRL은 인간 관점보다 robot method·system·learning advance를 더 앞에 둘 수 있다.
    boundary: >-
      CHI도 technical system paper를 받고 user study가 항상 필수인 것은 아니다. 다만 computation이나 system performance에
      meaningful human involvement가 거의 없다면 Computational Interaction을 포함한 HCI review lens에서 fit이 약해진다.
    snapshot:
      - value: Official criterion
        label: Excellent original research contribution to HCI
      - value: Typical evidence
        label: Subfield-appropriate validation, transparency and rigor
      - value: Strong fit
        label: Reusable interaction, user, design, system or practice knowledge
      - value: Recheck fit
        label: Robot accuracy gain without a meaningful human consequence
    position_note: >-
      CHI 2026의 25.3%는 전체 conditional acceptance 비율이다. Subcommittee별 비율은 15.8%에서 33.6%까지 달랐으므로,
      이 숫자를 개별 topic의 난이도나 uniform threshold로 해석하면 안 된다.
    taste_intro: >-
      좋은 CHI HRI paper는 robot demo를 넘어 <strong>HCI researcher가 다음 interface·study·deployment에서 사용할 수 있는 차이</strong>를 만든다.
    matrix:
      - axis: Problem
        sound: Robot interface의 사용성을 개선
        shaped: 어떤 interaction barrier와 user practice가 기존 HCI로 설명되지 않는지 명시
      - axis: Claim
        sound: Task time과 만족도가 향상
        shaped: 새 interaction capability, user benefit 또는 design knowledge를 분리해 일반화
      - axis: Evidence
        sound: Usability scale과 통계적 차이
        shaped: Claim에 맞는 behavior·experience·practice evidence와 alternative explanation
      - axis: Framing
        sound: Robot 기능과 experiment를 기술
        shaped: HCI literature gap, robot embodiment가 mechanism에 왜 중요한지, claim의 적용 범위가 첫 페이지에 보임
    framing:
      diffuse:
        sample: “안경으로 robot을 지시하자 기존 controller보다 task time이 줄었다.”
        explain: 성능 차이는 보이지만 HCI에 남는 interaction principle과 user consequence가 아직 약하다.
      shaped:
        sample: “Hands-busy 상황에서 gaze와 deictic gesture를 결합한 instruction이 attention switching과 error recovery를 어떻게 바꾸는지 밝힌다.”
        explain: Interface, human cost, reusable interaction knowledge가 HCI 언어로 연결된다.
    lessons:
      - title: HCI contribution을 명사로 쓴다
        text: Technique, system, user insight, method, theory 중 무엇을 남기는지 abstract에서 명시한다.
      - title: Human viewpoint를 끝까지 유지한다
        text: Technical section 이후 conclusion에서 사람이 단지 test subject로 축소되지 않게 한다.
      - title: Subcommittee를 topic으로 고르지 않는다
        text: 어떤 reviewer lens가 core contribution을 가장 공정하게 판단할지 선택한다.
      - title: Performance의 인간적 의미를 설명한다
        text: 빠름·정확함이 attention, agency, accessibility, practice에 어떤 차이를 만드는지 보여준다.
      - title: Robot specificity와 generality를 함께 쓴다
        text: Embodiment가 만든 mechanism과 claim scope를 명시한다. 다른 interactive system으로의 일반화는 가능한 장점이지 필수 조건이 아니다.
    submit:
      big: HCI contribution
      small: Robot을 통해 사람과 computing에 무엇을 남기는가?
      items:
        - <b>Contribution:</b> artifact · user · system · method · theory · vision
        - <b>Subcommittee:</b> core claim을 평가할 lens
        - <b>Validation:</b> claim에 맞는 qualitative·quantitative·technical evidence
        - <b>Boundary:</b> HRI-specific claim과 robotics advance를 분리
    final:
      big: >-
        가장 간결하게 말하면, <strong>CHI의 HRI paper는 robot을 통해 HCI knowledge를 만드는 논문</strong>이다.
      small: >-
        Robot performance도 contribution의 일부가 될 수 있지만, 그 성능이 사람과 interaction에 어떤 새로운 가능성과 지식을 남기는지까지 설명해야 한다.
    spectrum_intro: >-
      아래 질문은 CHI 2026의 공식 contribution types와 HRI가 실제로 놓일 수 있는 subcommittee lens를 바탕으로 구성한 편집 예시다.
    hero_question:
      tag: Interaction
      title: Robot instruction interface가 사용자의 attention과 recovery strategy를 어떻게 바꾸는가?
      text: 새 artifact와 technique가 인간 관점의 capability와 reusable HCI knowledge로 이어질 때 CHI framing이 강해진다.
    questions:
      - tag: User understanding
        title: 사람은 autonomous robot의 uncertainty를 어떤 cue로 해석하는가?
        text: Mental model, attribution, trust calibration을 HCI knowledge로 만드는 질문.
      - tag: Accessibility
        title: 기존 robot interface가 누구의 몸과 감각을 기본값으로 가정하는가?
        text: Inclusive design과 assistive interaction의 barrier를 드러내는 질문.
      - tag: Beyond individual
        title: Robot이 팀의 역할·권한·책임 배분을 어떻게 바꾸는가?
        text: Group, organization, collaboration practice를 다루는 HCI 질문.
      - tag: System
        title: 새로운 sensing·feedback loop가 이전에 불가능한 interaction을 여는가?
        text: Technical artifact를 human capability와 함께 검증하는 system contribution.
      - tag: Field study
        title: 병원·가정·공공공간에서 robot이 실제 work practice에 어떻게 편입되는가?
        text: Deployment를 socio-technical insight로 일반화하는 질문.
      - tag: Method · theory
        title: Embodied AI를 연구하기 위해 기존 HCI method를 어떻게 바꿔야 하는가?
        text: HRI를 넘어 HCI research practice 자체를 전진시키는 질문.
    selection_note: >-
      CHI contribution은 특정 method와 일대일 대응하지 않는다. System paper도 user study가 필수는 아니며, 사람을 연구했다고 자동으로 CHI contribution이 되는 것도 아니다.
    sources:
      - label: CHI 2026 — Contributions to CHI
        url: "https://chi2026.acm.org/contributions-to-chi/"
      - label: CHI 2026 — Guide to a Successful Submission
        url: "https://chi2026.acm.org/guide-to-a-successful-submission/"
      - label: CHI 2026 — Selecting a Subcommittee
        url: "https://chi2026.acm.org/authors/papers/selecting-a-subcommittee/"
      - label: CHI 2026 — Papers Track Outcomes
        url: "https://chi2026.acm.org/2026/02/06/insights-into-the-papers-track-post-pc-meeting-outcomes/"

  - slug: ro-man
    order: 3
    group: conference
    badge: RO-MAN
    name: IEEE RO-MAN
    full_name: IEEE International Conference on Robot and Human Interactive Communication
    meta: HRI Specialist Forum · IEEE RAS
    accent: "#27736e"
    accent_dark: "#18524f"
    accent_soft: "#e8f5f3"
    hub_intro: >-
      RO-MAN을 “HRI보다 낮은 단계의 응용 학회”로 보면 공식 범위와 community를 왜곡한다.
      이 venue는 robot and human interactive communication의 theory·methodology·technology·empirical study를
      <strong>communication, collaboration, coexistence</strong>라는 넓은 언어 아래 모은다.
    hub_detail: >-
      2026 FAQ는 robot design에 관한 perspective·position paper 문의에 대해, 고도로 technical하지 않다는 이유만으로
      거절하지 않으며 quality와 community contribution을 본다고 안내한다. Technical novelty만이 유일한 평가 축은 아니라는 뜻이다.
    definition: >-
      사람과 robot이 어떻게 소통·협업·공존하는지를 theory부터 technology, experiment, design, application까지 폭넓게 다루는 HRI 전문 forum
    thesis: >-
      RO-MAN의 지속적인 중심 범위는 <strong>Robot and Human Interactive Communication</strong>이다.
      “Realizing Human–Robot Symbiosis with AI”는 RO-MAN 2026의 연례 theme이며, 모든 연도·논문에 적용되는 필수 framing은 아니다.
    thesis_note: >-
      HRI와 scope는 크게 겹친다. 두 venue의 차이를 quality hierarchy로 만들기보다,
      HRI track-specific contribution과 RO-MAN의 communication·collaboration·coexistence 중심 program language 중 어디가 더 자연스러운지 본다.
    facts:
      - value: Since 1992
        label: Robot and Human Interactive Communication community의 장기 conference series
      - value: Broad Methods
        label: Theory · methodology · technology · empirical and experimental study
      - value: Symbiosis + AI
        label: RO-MAN 2026의 공식 conference theme
      - value: Technicality ≠ Quality
        label: Perspective·position paper도 technicality 부족만으로 거절하지 않으며 quality와 community contribution을 평가
    identity:
      - title: Primary knowledge unit
        text: >-
          Verbal·non-verbal signal, affect, trust, team coordination, assistive application, social role,
          shared autonomy가 사람과 robot의 communication·coexistence를 어떻게 바꾸는지가 중심이다.
      - title: Reviewer가 먼저 보는 것
        text: >-
          논문이 RO-MAN community에 meaningful contribution을 하는지, method와 evidence가 claim에 적절한지,
          그리고 communication·interaction 문제의 맥락이 충분히 설명되는지를 본다.
    scope:
      - title: Communication
        items:
          - Dialogue and multimodal interaction
          - Non-verbal cue and social signal
          - Affect · emotion · personality
          - Explainability and transparency
      - title: Teams · collaboration
        items:
          - Human–robot team and cooperation
          - Shared autonomy and teleoperation
          - Trust · intent · mental model
          - Human-centered navigation
      - title: Society · application
        items:
          - Assistive · care · rehabilitation
          - Child–robot and education
          - Ethics · value alignment · safety
          - Co-design and social identity
    rule:
      label: RO-MAN의 기본 단위
      text: >-
        <strong>사람과 robot이 어떻게 의미를 주고받고 역할을 조정하는가</strong>가 하나의 coherent story를 만들어야 한다.
        Pure robotics method나 human-free benchmark가 중심이면 broad robotics venue가 더 자연스럽다.
    position:
      - label: Primary claim
        text: Human–robot communication, collaboration, team, relationship 또는 coexistence의 진전.
      - label: Core audience
        text: HRI researcher, social roboticist, assistive-robotics and human–robot team researcher.
      - label: Evidence
        text: Experiment, user study, system test, design case, field deployment, qualitative or position argument.
      - label: Program lens
        text: Cognition·intent·embodied AI부터 care·ethics·teleoperation·manufacturing까지 폭넓은 HRI program.
      - label: Strong signal
        text: Communication behavior와 application context가 하나의 HRI contribution으로 묶인다.
      - label: Weak signal
        text: Robot algorithm의 성능만 남고 사람과의 communication mechanism이 결론에 없다.
    neighbors: >-
      ACM/IEEE HRI는 principal contribution을 다섯 track으로 더 선명하게 분리한다.
      ICSR은 social robot 자체와 사회적 역할을 더 중심에 두며, ICRA·IROS는 robotics capability를 먼저 본다.
    boundary: >-
      RO-MAN의 broad scope를 “덜 선택적” 또는 “응용 위주”로 번역하면 안 된다.
      Perspective·position paper에 대한 FAQ 답변은 contribution 형식의 폭을 보여주지만 quality requirement가 낮다는 근거가 아니다.
    snapshot:
      - value: Official scope
        label: Theory · methodology · technology · empirical and experimental studies
      - value: Typical evidence
        label: Communication behavior, team process, system and application evidence
      - value: Strong fit
        label: Social · assistive · team · multimodal HRI의 coherent story
      - value: Recheck fit
        label: Human interaction이 거의 없는 pure robotics advance
    position_note: >-
      RO-MAN 2026 program은 cognition and intent, children and companions, ethics and methodology, handover and teleoperation,
      proactive assistance, emotion and anthropomorphism, safe motion and manufacturing을 함께 묶었다. 이것이 venue의 실제 breadth를 잘 보여준다.
    taste_intro: >-
      좋은 RO-MAN paper는 여러 technical·human component를 나열하기보다 <strong>사람과 robot이 소통하고 역할을 조정하는 한 장면</strong>을 중심 story로 만든다.
    matrix:
      - axis: Problem
        sound: Social robot의 새 기능을 평가
        shaped: 어떤 communication·relationship·team breakdown을 해결하는지 명시
      - axis: Claim
        sound: Trust와 task performance가 향상
        shaped: 어떤 cue·behavior·coordination mechanism이 결과를 만들었는지 설명
      - axis: Evidence
        sound: User rating과 system accuracy
        shaped: Behavioral·technical·context evidence를 communication claim에 맞게 연결
      - axis: Framing
        sound: Application과 demo를 소개
        shaped: Communication, collaboration, coexistence에 남는 community contribution이 첫 페이지에 보임
    framing:
      diffuse:
        sample: “LLM을 탑재한 social robot이 baseline보다 더 자연스럽다는 평가를 받았다.”
        explain: Technology와 rating은 보이지만 무엇이 communication을 바꿨는지 설명이 약하다.
      shaped:
        sample: “Robot persona의 일관성이 깨질 때 사용자의 repair strategy와 장기적 role expectation이 어떻게 변하는지 밝힌다.”
        explain: Communication breakdown, social mechanism, application consequence가 하나의 story가 된다.
    lessons:
      - title: Communication을 대화만으로 좁히지 않는다
