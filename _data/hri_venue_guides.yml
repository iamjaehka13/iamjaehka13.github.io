venues:
  - slug: hri
    order: 1
    group: conference
    badge: HRI
    name: ACM/IEEE HRI
    full_name: ACM/IEEE International Conference on Human-Robot Interaction
    meta: Premier HRI Conference · ACM / IEEE
    accent: "#315ea8"
    accent_dark: "#203f78"
    accent_soft: "#eaf0fb"
    hub_intro: >-
      HRI를 단순히 “사람을 모집해 robot을 평가하는 학회”로 이해하면 핵심을 놓친다.
      HRI는 theory·design·technical component·integrated system·user study를 모두 받으며,
      논문이 남기는 가장 큰 지식이 <strong>human–robot interaction 자체</strong>에 있는지를 묻는다.
    hub_detail: >-
      2026 full paper는 Theory & Methods, Design, Technical, Systems, User Studies의 다섯 track으로 나뉜다.
      Technical·Systems track에는 user study가 항상 필요하지 않으며, reviewer guide는 작은 결함이 있더라도
      impact와 novelty가 큰 연구를 낮은 impact의 완벽한 연구보다 우선해 보도록 안내한다.
    definition: >-
      인간과 robot이 서로 영향을 주는 과정의 이해·설계·방법·기술을 전진시키는 연구가 모이는 HRI의 중심 conference
    thesis: >-
      HRI에서는 선택한 track의 <strong>primary knowledge contribution이 HRI를 어떻게 전진시키는지</strong>,
      그리고 그 claim에 맞는 evidence가 있는지가 중요하다.
    thesis_note: >-
      HRI 2026의 다섯 track은 user study만이 아니라 theory, design, algorithm, interface, system integration도
      HRI contribution이 될 수 있음을 공식적으로 보여준다.
    facts:
      - value: 5 Tracks
        label: Theory & Methods · Design · Technical · Systems · User Studies
      - value: ~25% Typical
        label: Reviewer guide의 통상 full-paper acceptance 안내이며 2026 확정치가 아님
      - value: Study Optional
        label: Technical·Systems claim은 적절한 technical evaluation으로 지지 가능
      - value: ACM + IEEE
        label: Engineering·design·behavioral·social science가 만나는 공동 community
    identity:
      - title: Primary knowledge unit
        text: >-
          Robot behavior, interaction technique, theory, method, integrated capability 또는 사람에게서 얻은 insight 중
          무엇이든 가능하다. 공통점은 그 결과가 HRI community의 이해나 설계 능력을 직접 확장한다는 것이다.
      - title: Reviewer가 먼저 보는 것
        text: >-
          선택한 track의 principal contribution이 선명한지, novelty와 impact가 충분한지,
          그리고 claim의 성격에 맞는 evidence를 제시했는지를 본다. “사람을 포함했다”는 사실만으로는 부족하다.
    scope:
      - title: Interaction knowledge
        items:
          - Trust · legibility · engagement
          - Collaboration · communication
          - Relationship · social behavior
          - Field and longitudinal HRI
      - title: Design · theory · methods
        items:
          - Robot morphology and behavior
          - Interaction technique and process
          - HRI theory and measurement
          - Reporting and evaluation methods
      - title: Technical · systems
        items:
          - HRI algorithm and model
          - Interface · tool · hardware element
          - Integrated HRI capability
          - Human-aware system behavior
    rule:
      label: 편집적 판단 · HRI의 기본 단위
      text: >-
        선택한 track의 contribution과 HRI relevance가 명확해야 한다.
        “Human–robot context를 제거했을 때 motivation과 contribution이 함께 약해지는가”는 편집적 점검 질문이지 공식 pass/fail 기준이 아니다.
        Technical·Systems paper는 algorithm, model, interface, component 또는 integrated capability로도 기여할 수 있다.
    position:
      - label: Primary claim
        text: HRI를 이해·설계·평가·구현하는 새로운 지식 또는 capability.
      - label: Core audience
        text: HRI researcher, roboticist, HCI·design researcher, behavioral and social scientist.
      - label: Evidence
        text: User study, field deployment, proof, simulation, component test, system demonstration 중 claim에 맞는 것.
      - label: Track lens
        text: Topic label이 아니라 논문이 남기는 principal contribution의 종류로 track을 고른다.
      - label: Strong signal
        text: 선택한 track의 primary contribution, HRI relevance, claim-aligned evaluation이 명확하다.
      - label: Weak signal
        text: HRI relevance가 설명되지 않고 사람 또는 robot이 generic benchmark 역할에만 머문다.
    neighbors: >-
      CHI는 결과를 HCI 전반에 일반화하고, RO-MAN은 communication·team·social application을 넓게 묶는다.
      ICRA·IROS·RSS·CoRL은 같은 problem에서도 robotics method·system·learning novelty를 먼저 요구한다.
    boundary: >-
      Physical robot이 항상 필수인 것은 아니다. HRI 2026 User Studies track은 physical robot 없는 연구도 허용한다.
      다만 contribution은 human–robot interaction에 남아야 하며, general human–agent insight가 중심이면 HAI가 더 자연스럽다.
    snapshot:
      - value: Official scope
        label: Technical · design · behavioral · theoretical · methodological HRI
      - value: Typical evidence
        label: Claim-aligned study, proof, simulation, test, deployment or demonstration
      - value: Strong fit
        label: Robot-specific interaction knowledge or HRI-enabling capability
      - value: Recheck fit
        label: Generic HCI insight only or robotics benchmark gain only
    position_note: >-
      HRI 2026 reviewer guidance는 big-idea, provocative, visionary work를 환영한다. 이것은 rigor를 포기한다는 뜻이 아니라,
      완성도만 높은 작은 increment보다 field에 남을 차이를 분명히 보여주라는 community signal이다.
    taste_intro: >-
      좋은 HRI paper는 “robot을 사용했다”가 아니라 <strong>interaction을 통해 무엇을 새로 알거나 가능하게 했는지</strong>가
      abstract 첫 문장과 evidence에서 같은 방향을 가리킨다.
    matrix:
      - axis: Problem
        sound: 잘 알려진 robot behavior를 사람에게 평가
        shaped: 왜 이 behavior가 HRI의 중요한 관계·협업 문제를 바꾸는지 명시
      - axis: Claim
        sound: System 성능과 만족도가 모두 상승
        shaped: 어떤 interaction mechanism 또는 reusable HRI knowledge가 생겼는지 분리
      - axis: Evidence
        sound: 큰 표본과 유의한 차이
        shaped: Claim에 맞는 behavioral·technical·field evidence와 failure boundary
      - axis: Framing
        sound: Robot feature와 experiment를 자세히 설명
        shaped: HRI literature의 gap, principal track, community consequence가 첫 페이지에 보임
    framing:
      diffuse:
        sample: “새 multimodal robot interface를 구현하고 36명에게 사용성을 평가했다.”
        explain: Interface와 study는 보이지만 HRI에 남는 central knowledge가 무엇인지 아직 흐리다.
      shaped:
        sample: “Robot이 불확실성을 질문으로 드러낼 때, 사용자의 correction과 shared task recovery가 어떻게 달라지는지 밝힌다.”
        explain: Robot-specific behavior, interaction mechanism, generalizable HRI claim이 하나의 문장에 묶인다.
    lessons:
      - title: Track을 topic이 아니라 contribution으로 고른다
        text: 같은 system도 algorithm이 중심이면 Technical, integration이면 Systems, human insight면 User Studies다.
      - title: User study를 의식처럼 붙이지 않는다
        text: 사람을 포함할지보다 어떤 evidence가 claim을 실제로 반증 가능하게 만드는지 먼저 정한다.
      - title: Robot specificity를 설명한다
        text: Embodiment, motion, autonomy, shared space가 interaction question을 어떻게 바꾸는지 쓴다.
      - title: Impact와 rigor를 함께 설계한다
        text: 큰 아이디어를 주장하되 limitation, failure, measurement validity를 숨기지 않는다.
      - title: HCI·robotics 독자도 읽게 만든다
        text: Interdisciplinary venue인 만큼 한 subfield의 jargon만으로 contribution을 닫지 않는다.
    submit:
      big: HRI itself
      small: 논문 뒤에 HRI knowledge가 남는가?
      items:
        - <b>Track:</b> principal contribution 하나를 먼저 선택
        - <b>Evaluation:</b> track과 claim에 맞는 evidence
        - <b>Ethics:</b> 사람·현장 연구의 승인과 reporting 확인
        - <b>Boundary:</b> CHI·RO-MAN·robotics venue framing과 비교
    final:
      big: >-
        가장 간결하게 말하면, <strong>HRI는 사람과 robot 사이의 관계·행동·설계·기술 자체를 연구 단위로 삼는 conference</strong>다.
      small: >-
        좋은 HRI paper는 user study의 크기나 system의 복잡성보다, interaction을 통해 생긴 한 가지 차이를 community가 다시 사용할 수 있게 만든다.
    spectrum_intro: >-
      아래는 특정 논문의 ranking이 아니라 HRI 2026 공식 track 구조가 허용하는 연구 질문의 폭을 보여주는 예시다.
      같은 robot이라도 primary question과 evidence가 달라지면 서로 다른 track의 paper가 된다.
    hero_question:
      tag: Systems
      title: 사람이 개입할 시점을 robot이 스스로 조절하는 새로운 shared-task capability
      text: 여러 component를 통합한 behavior와 reusable system lesson이 primary contribution이라면 Systems lens가 자연스럽다.
    questions:
      - tag: Theory & Methods
        title: Trust를 한 점수 대신 어떤 동적 관계로 모델링할 것인가?
        text: HRI concept, construct, measurement 또는 reporting practice를 바꾸는 질문.
      - tag: Design
        title: Robot의 motion과 morphology가 legibility를 어떻게 만드는가?
        text: 재현 가능한 design process와 interaction technique가 중심인 질문.
      - tag: Technical
        title: Robot이 사람의 intent를 실시간 추론해 behavior를 바꿀 수 있는가?
        text: Algorithm, model, interface 또는 hardware element의 HRI contribution.
      - tag: User Studies
        title: Robot의 explanation이 failure attribution과 recovery를 어떻게 바꾸는가?
        text: 사람에게서 얻은 generalizable knowledge가 system보다 중심인 질문.
      - tag: Field HRI
        title: 가정·병원·교육 현장에서 관계가 시간에 따라 어떻게 변하는가?
        text: Longitudinal deployment와 실제 practice에서 얻는 HRI insight.
      - tag: Inclusive HRI
        title: 누가 현재의 robot behavior에서 배제되고 있으며 어떻게 공동 설계할까?
        text: Accessibility, participation, power, context를 interaction 설계에 연결하는 질문.
    selection_note: >-
      이 질문들은 scope를 설명하기 위한 편집 예시다. 실제 submission의 track, page limit, ethics, anonymity 정책은 해당 연도 공식 CFP를 다시 확인해야 한다.
    sources:
      - label: HRI 2026 Full Papers and Track Descriptions
        url: "https://humanrobotinteraction.org/2026/full-papers/"
      - label: HRI 2026 Full Paper Reviewer Guidelines
        url: "https://humanrobotinteraction.org/2026/full-paper-reviewer-guidelines/"
      - label: HRI 2026 Award Nominees and Track Examples
        url: "https://humanrobotinteraction.org/2026/award-nominees/"
      - label: JST/CRDS — Research and Development Trends in HRI (2026)
        url: "https://doi.org/10.82643/crds-fr-s-ro-hri"

  - slug: icra-iros
    order: 6
    group: conference
    badge: ICRA·IROS
    name: ICRA · IROS
    full_name: IEEE International Conference on Robotics and Automation · IEEE/RSJ International Conference on Intelligent Robots and Systems
    meta: Broad Robotics Conferences · IEEE RAS / RSJ
    accent: "#2f8065"
    accent_dark: "#1e5948"
    accent_soft: "#e9f6f0"
    hub_intro: >-
      ICRA는 algorithm, IROS는 application이라는 고정 공식은 두 conference의 공식 범위보다 훨씬 좁다.
      둘 다 robotics 전 영역을 다루는 broad conference다. 양쪽 공식 keyword에는 HRI와 Human Factors and Human-in-the-Loop가 있고,
      IROS 2026 CFP는 multimodal interface and human robot interaction을 별도로 명시한다.
    hub_detail: >-
      HRI paper도 충분히 자연스럽지만 보통 primary contribution은 shared autonomy, pHRI control, human-aware planning,
      assistive system, teleoperation 같은 robotics advance다. Human study는 중요할 수 있으나 대개 그 technical·system claim을 지지한다.
    definition: >-
      HRI를 포함해 robotics 전 영역의 새로운 method, mechanism, system, integration, capability와 application을 모으는 두 broad robotics conference
    thesis: >-
      ICRA·IROS의 HRI paper는 먼저 <strong>좋은 robotics paper</strong>여야 한다.
      사람을 포함한 맥락이 새 estimation·planning·control·system capability를 왜 필요하게 만드는지 보여준다.
    thesis_note: >-
      IEEE RAS 공개 guidance는 paper를 Editor와 AE에 배정하고, AE가 최소 두 개의 review를 확보해 recommendation을 작성하며
      Editor가 이를 검토·endorse하는 절차를 설명한다. Session과 technical committee는 공개된 accept/reject 기준이 아니다.
    facts:
      - value: Broad Robotics
        label: ICRA와 IROS 모두 robotics와 intelligent systems 전 영역을 포괄
      - value: HRI Explicit
        label: HRI·human-in-the-loop는 양쪽 keyword, multimodal interface는 IROS 2026 CFP에 명시
      - value: ICRA Flagship
        label: IEEE RAS flagship conference이자 robotics 전체의 premier forum
      - value: IROS
        label: IEEE/RSJ 명칭의 intelligent robots and systems forum
    identity:
      - title: Primary knowledge unit
        text: >-
          Human-aware estimation, planning, control, perception, mechanism, interface 또는 integrated robot system이
          이전에 없던 capability를 만들고 robotics community가 재사용할 technical knowledge를 남긴다.
      - title: Reviewer가 먼저 보는 것
        text: >-
          공개 guidance는 reviewer assessment, AE recommendation, Editor endorsement의 절차와 conference scope·standards 적합성을 설명한다.
          별도의 HRI-only scoring rubric은 제시하지 않는다.
    scope:
      - title: Human-aware autonomy
        items:
          - Intent and capability estimation
          - Human-aware navigation and planning
          - Shared autonomy and teleoperation
          - Explainable and adaptive autonomy
      - title: Physical interaction
        items:
          - pHRI control and safety
          - Haptics · handover · collaboration
          - Assistive manipulation
          - Rehabilitation and wearable robots
      - title: Integrated systems
        items:
          - Multimodal robot interface
          - Service and social robot system
          - Human–robot team capability
          - Perception–planning–control stack
    rule:
      label: Robotics 기본 단위
      text: >-
        <strong>사람과 함께 일하기 위해 어떤 새로운 robot capability를 만들었는가</strong>가 central claim이어야 한다.
        User perception이나 relationship insight가 system novelty보다 중심이면 HRI·CHI·RO-MAN이 더 직접적이다.
    position:
      - label: Primary claim
        text: HRI 맥락에서 성립하는 original robotics method, system, mechanism or capability.
      - label: Core audience
        text: Roboticist across perception, planning, control, learning, mechanisms, systems and applications.
      - label: Evidence
        text: Benchmark, simulation, theory, real robot, system integration, safety test and human experiment.
      - label: Review lens
        text: Human study도 robotics claim의 validity, utility, safety 또는 integrated performance를 검증한다.
      - label: Strong signal
        text: Human context를 제거해도 method novelty가 남고, 동시에 그 context가 problem formulation을 본질적으로 만든다.
      - label: Weak signal
        text: Robot은 study apparatus이고 가장 큰 결과가 trust·experience·relationship뿐이다.
    neighbors: >-
      RSS는 single-track science/systems claim을 더 압축해서 요구하고, CoRL은 learning contribution을 중심에 둔다.
      HRI는 같은 system도 interaction knowledge나 HRI-enabling component 자체를 primary claim으로 만들 수 있다.
    boundary: >-
      두 venue의 scope는 크게 겹친다. 제출처 비교에는 해당 연도 CFP, 공식 topics·keywords, submission policy와 recent accepted work를 사용하되,
      session 이름이나 technical committee를 accept/reject 절차로 해석하지 않는다.
    snapshot:
      - value: Official scope
        label: Robotics · automation · intelligent robots and smart machines
      - value: Typical evidence
        label: Technical analysis plus simulation, benchmark, real robot or system validation
      - value: Strong fit
        label: Human-aware robotics advance with clear method or capability
      - value: Recheck fit
        label: Human insight only, with little robotics novelty
    position_note: >-
      ICRA 2026에는 HRI keynote, regular session, Best Paper Award on Human-Robot Interaction이 있었다.
      HRI가 주변 topic이라는 뜻은 틀리지만, broad robotics program 안에서 technical contribution을 경쟁한다는 위치는 분명하다.
    taste_intro: >-
      좋은 ICRA·IROS HRI paper는 <strong>사람이 만든 constraint와 uncertainty를 robotics problem으로 정확히 formalize</strong>하고,
      새 capability가 실제 system에서 왜 중요한지 보여준다.
    matrix:
      - axis: Problem
        sound: 사람과 함께 쓰는 robot system을 구현
        shaped: 어떤 human-aware estimation·planning·control 병목을 새 robotics problem으로 정의
      - axis: Claim
        sound: Task performance와 만족도 향상
        shaped: Method·system capability의 novelty와 인간 맥락의 consequence를 분리해 명시
      - axis: Evidence
        sound: Demo와 user study
        shaped: Baseline·ablation·failure·real robot·safety·human evidence를 claim에 맞게 조합
      - axis: Framing
        sound: HRI application을 소개
        shaped: Robotics literature gap과 broad robotics audience가 재사용할 차이가 첫 페이지에 보임
    framing:
      diffuse:
        sample: “사용자 명령을 이해해 책상을 정리하는 multimodal robot을 만들었다.”
        explain: Demo는 흥미롭지만 technical bottleneck과 robotics novelty가 아직 선명하지 않다.
      shaped:
        sample: “Ambiguous deictic command를 active clarification과 task-and-motion planning에 통합해 cluttered manipulation의 recovery rate를 높인다.”
        explain: Human input이 새 formulation, integrated capability, measurable robotics evidence로 이어진다.
    lessons:
      - title: Human context를 robotics problem으로 만든다
        text: Intent, uncertainty, safety, shared workspace가 state·constraint·objective를 어떻게 바꾸는지 쓴다.
      - title: Integrated demo만으로 끝내지 않는다
        text: Central method와 각 component의 역할, failure boundary를 분리한다.
      - title: User study의 역할을 명확히 한다
        text: Interaction insight가 아니라 capability utility·safety·performance를 검증한다면 그렇게 쓴다.
      - title: ICRA·IROS folklore를 피한다
        text: 고정 taste보다 CFP, official topics·keywords, submission policy와 recent accepted work를 근거로 비교한다.
      - title: Broad audience를 설득한다
        text: 한 application을 넘어 robotics에 남는 method·system lesson을 보여준다.
    submit:
      big: Robotics advance
      small: 사람과 함께 일하기 위해 무엇을 새로 가능하게 했는가?
      items:
        - <b>Method:</b> estimation · planning · control · perception · mechanism
        - <b>System:</b> integration and end-to-end capability
        - <b>Evidence:</b> baseline · ablation · real robot · safety · human test
        - <b>Fit:</b> current CFP · official topics/keywords · submission policy
    final:
      big: >-
        가장 간결하게 말하면, <strong>ICRA·IROS의 HRI는 사람과 함께 작동하는 robot의 새 기술·시스템·capability를 만드는 research</strong>다.
      small: >-
        Human study의 존재가 venue를 결정하지 않는다. 논문 뒤에 interaction knowledge보다 robotics advance가 더 크게 남는지가 핵심이다.
    spectrum_intro: >-
      아래 질문은 ICRA·IROS 공식 scope와 ICRA 2026 HRI program에서 자주 보이는 robotics-first research unit을 보여주는 편집 예시다.
    hero_question:
      tag: Shared autonomy
      title: 사람의 intent와 capability uncertainty를 online으로 추정해 assistance policy를 바꿀 수 있는가?
      text: Human signal을 estimation·planning·control의 새 formulation과 integrated robot capability로 만드는 질문.
    questions:
      - tag: Physical HRI
        title: 접촉 상태와 human comfort를 보장하는 새로운 control law는 무엇인가?
        text: Stability, safety, haptics, collaboration을 다루는 robotics 질문.
      - tag: Navigation
        title: 사람의 group·motion·social constraint를 planning에 어떻게 넣을까?
        text: Perception과 human-aware planning을 연결하는 질문.
      - tag: Teleoperation
        title: Operator workload와 uncertainty에 따라 autonomy level을 조절할 수 있는가?
        text: Interface를 shared-control system capability로 만드는 질문.
      - tag: Assistive robotics
        title: 사용자의 reachability를 추정해 도움의 timing과 magnitude를 정할 수 있는가?
        text: Human capability model과 assistance policy의 질문.
      - tag: System integration
        title: Language·gesture·vision을 grounding해 manipulation까지 안정적으로 연결할 수 있는가?
        text: Multimodal perception부터 execution과 recovery까지의 system 질문.
      - tag: Safety · explainability
        title: Robot decision의 uncertainty와 reason을 행동 중 전달할 수 있는가?
        text: Explainable architecture와 safe autonomy를 기술적으로 검증하는 질문.
    selection_note: >-
      실제 선택 순서: ① current CFP·official topics/keywords, ② 가장 가까운 recent session과 accepted-paper 밀도,
      ③ deadline·submission cycle, ④ 논문이 만나야 할 primary audience, ⑤ 관련 technical committee의 community를 따로 비교한다.
      Session과 committee는 community map이지 accept/reject rubric은 아니다.
