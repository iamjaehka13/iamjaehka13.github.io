      - tag: Safety · ethics
        title: 설명 가능성과 human control을 실제 behavior에 어떻게 넣을까?
        text: Value alignment, transparency, safe interaction의 구현 질문.
      - tag: Design · position
        title: Social humanoid의 capability gap을 어떤 design principle로 다룰까?
        text: Empirical paper뿐 아니라 rigorous perspective와 co-design argument의 예시.
    selection_note: >-
      RO-MAN은 HRI와 상당히 겹친다. 이 질문들은 영구적인 분리 규칙이 아니라 해당 venue의 program language를 드러내기 위한 예시다.
