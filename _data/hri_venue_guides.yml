  - slug: rss
    order: 7
    group: conference
    badge: RSS
    name: RSS
    full_name: "Robotics: Science and Systems"
    meta: High-quality Single Track · Independent Foundation
    accent: "#2d756f"
    accent_dark: "#1a5350"
    accent_soft: "#e8f5f3"
    hub_intro: >-
      RSS를 “작고 이론적인 robotics conference”로만 보면 science와 systems를 함께 요구하는 정체성을 놓친다.
      RSS Foundation은 open, high-quality, single-track conference를 지향하고,
      CFP는 <strong>novel scientific and systems contributions</strong>을 명시한다.
    hub_detail: >-
      2026 program에는 HRI session이 별도로 있었고 preference learning, reward repair, engagement,
      human capability estimation, shared wheelchair control 같은 문제가 포함됐다. 편집적으로 보면,
      이 세션의 여러 논문은 human signal을 robotics science·system problem과 연결한다.
    definition: >-
      서로 다른 robotics subfield가 같은 program을 공유하며, 검증 가능한 novel science 또는 system contribution을 압축된 single-track paper로 제시하는 conference
    thesis: >-
      RSS의 HRI paper는 사람의 반응을 보고하는 데서 끝나지 않고
      <strong>human preference·state·capability·input을 robotics principle과 system으로 만든다</strong>.
    thesis_note: >-
      공식 CFP가 명시하는 기준은 novel scientific and systems contributions, best work, concise·lucid·self-contained presentation,
      expert가 central claims를 검증할 수 있는 본문이다. Human variable을 state·constraint·objective로 formalize한다는 설명은
      2026 HRI session에서 읽은 편집적 pattern이지 공식 rubric이 아니다.
    facts:
      - value: Single Track
        label: 서로 다른 robotics subfield가 같은 발표와 논의를 공유
      - value: Science + Systems
        label: CFP가 novel scientific and systems contributions를 함께 요청
      - value: Best Work
        label: Authors의 가장 강한 work와 self-contained technical story를 요구
      - value: HRI Session
        label: RSS 2026 accepted program에 Human-Robot Interaction session 존재
    identity:
      - title: Primary knowledge unit
        text: >-
          Formal method, scientific principle, system architecture 또는 integrated capability가 robotics 문제를 새롭게 해결하며,
          HRI에서는 human signal과 constraint가 그 formulation에 본질적으로 들어간다.
      - title: Reviewer가 먼저 보는 것
        text: >-
          공식 review guidance는 constructive·specific·substantiated review를 요구하며 novelty, importance, technical concern, clarity를 사례로 설명한다.
          이것들은 공개된 네 개의 formal scoring axis는 아니다.
    scope:
      - title: Human inference
        items:
          - Preference and intent inference
          - Capability and reachability model
          - Engagement and state estimation
          - Reward alignment and explanation
      - title: Shared autonomy
        items:
          - Assistance policy and timing
          - Shared control and teleoperation
          - Human-in-the-loop planning
          - Safety and uncertainty
      - title: HRI systems
        items:
          - Integrated assistive system
          - Human-aware mechanism
          - Dataset and benchmark
          - Reusable system principle
    rule:
      label: 편집적 RSS fit heuristic
      text: >-
        2026 HRI session을 읽는 유용한 heuristic은 human context가 novel robotics science 또는 system contribution에
        어떻게 들어가는지를 보는 것이다. 특정 formalization은 CFP의 필수요건이 아니다.
    position:
      - label: Primary claim
        text: Significant novel robotics science or system contribution, with human context when essential.
      - label: Core audience
        text: Broad robotics researcher in a single-track technical community.
      - label: Evidence
        text: Formal analysis, simulation, benchmark, real system, human-in-loop test and failure analysis.
      - label: Paper lens
        text: Concise, lucid, self-contained story whose key technical ideas can be verified by experts.
      - label: Editorial strong signal
        text: Human state·preference·input becomes a new estimation, policy, control or system principle.
      - label: Editorial recheck signal
        text: Human study가 primary result이고 robotics formulation이나 capability는 기존 그대로다.
    neighbors: >-
      ICRA·IROS는 더 큰 broad program에서 robotics 전 영역을 받고, CoRL은 learning contribution을 중심에 둔다.
      HRI는 같은 method도 interaction knowledge나 HRI-enabling component를 primary claim으로 만들 수 있다.
    boundary: >-
      RSS를 theory·learning 전용으로 좁히지 않는다. 2026 CFP는 novel scientific and systems contributions를 함께 요청하며,
      2026 HRI session에도 control, assistance, engagement, mechanism과 data-oriented work가 공존한다.
    snapshot:
      - value: Official scope
        label: Novel scientific and systems contributions across robotics
      - value: Typical evidence
        label: Central claims를 expert가 검증할 수 있도록 필요한 내용을 self-contained main paper에 제시
      - value: Strong fit
        label: Human-in-loop robotics principle or novel system capability
      - value: Recheck fit
        label: Perception·experience insight without robotics advance
    position_note: >-
      RSS 2026 accepted program의 HRI example은 해당 연도의 관찰이지 영구적인 scope 정의가 아니다.
      다만 human behavior를 estimation, policy, control, safety, mechanism과 연결하는 공통 pattern은 venue fit을 이해하는 유용한 evidence다.
    taste_intro: >-
      좋은 RSS HRI paper는 <strong>사람이 있다는 사실을 새 robotics state·constraint·objective·system principle로 바꾸고</strong>,
      그 핵심 idea를 좁고 검증 가능한 claim으로 제시한다.
    matrix:
      - axis: Problem
        sound: Human-in-loop robot system을 구현
        shaped: 기존 robotics formulation이 human uncertainty를 다루지 못하는 정확한 gap을 정의
      - axis: Claim
        sound: User outcome과 success rate 향상
        shaped: New inference·policy·control·system principle과 consequence를 명시
      - axis: Evidence
        sound: Demo와 평균 성능
        shaped: Formal property·baseline·ablation·failure·system/human evidence를 한 claim에 연결
      - axis: Framing
        sound: HRI application이 흥미로움
        shaped: Broad robotics researcher가 검증하고 재사용할 science/systems difference가 첫 페이지에 보임
    framing:
      diffuse:
        sample: “사용자 feedback을 받아 더 도움이 되는 assistive robot을 만들었다.”
        explain: Human involvement는 보이지만 formal problem과 novel robotics principle이 아직 흐리다.
      shaped:
        sample: “Unknown human reachability를 active query로 추정하고 uncertainty-aware assistance timing policy를 도출한다.”
        explain: Human capability가 estimation과 policy의 새 technical contribution으로 변환된다.
    lessons:
      - title: Human variable을 formalize한다
        text: Preference, intent, capability, engagement가 state·observation·reward·constraint 중 무엇인지 쓴다.
      - title: 한 가지 technical idea를 중심에 둔다
        text: 여러 module보다 expert가 검증할 core principle과 consequence를 압축한다.
      - title: Science와 systems 중 강점을 명시한다
        text: Formal result와 integrated capability가 모두 가능하지만 primary unit을 흐리지 않는다.
      - title: Human study를 mechanism과 연결한다
        text: Outcome 차이가 왜 policy·control·system design 때문에 생겼는지 보여준다.
      - title: Failure boundary를 드러낸다
        text: 어떤 human model과 environment assumption에서 method가 깨지는지 쓴다.
    submit:
      big: Science / Systems
      small: Human-in-loop problem에서 어떤 검증 가능한 robotics 차이가 생겼는가?
      items:
        - <b>Formulation:</b> state · preference · capability · constraint
        - <b>Core idea:</b> estimation · policy · control · mechanism · system
        - <b>Evidence:</b> formal · baseline · ablation · real system · human
        - <b>Story:</b> concise · lucid · self-contained
    final:
      big: >-
        가장 간결하게 말하면, <strong>RSS의 HRI는 사람을 robotics science와 systems의 본질적인 변수로 만드는 research</strong>다.
      small: >-
        좋은 paper는 user study의 크기보다, human context에서 나온 하나의 technical principle과 system consequence가 명확하다.
    spectrum_intro: >-
      아래 질문은 RSS 2026 HRI session과 official science/systems language를 바탕으로 구성한 research spectrum 예시다.
    hero_question:
      tag: Capability inference
      title: 사람의 reachability를 능동적으로 추정해 assistance timing을 결정할 수 있는가?
      text: Human capability uncertainty를 estimation과 policy의 novel robotics problem으로 만드는 질문.
    questions:
      - tag: Preference
        title: 적은 interaction으로 human preference를 빠르고 안전하게 학습할 수 있는가?
        text: Query design, uncertainty, policy adaptation을 다루는 질문.
      - tag: Reward repair
        title: Misaligned robot reward를 targeted explanation과 correction으로 복구할 수 있는가?
        text: Alignment와 interactive recovery를 technical problem으로 만드는 질문.
      - tag: Shared control
        title: Wheelchair control authority를 안전성과 user intent에 따라 어떻게 배분할까?
        text: Deterministic or uncertainty-aware shared control 질문.
      - tag: Engagement
        title: Human engagement를 system state로 넣을 때 policy는 어떻게 달라지는가?
        text: Human-in-loop dynamics와 adaptive behavior 질문.
      - tag: Mechanism
        title: Conversational robot의 facial mechanism을 task와 expression에 맞게 자동 설계할 수 있는가?
        text: HRI embodiment를 mechanisms and systems contribution으로 만드는 질문.
      - tag: Safety
        title: Human model이 틀렸을 때 assistance system은 어떻게 fail safely 할 것인가?
        text: Robustness, uncertainty, recovery boundary 질문.
    selection_note: >-
      이 질문은 venue의 영구 기준이 아니라 2026 program과 CFP에서 읽히는 science/systems pattern을 설명하기 위한 편집 예시다.
    sources:
      - label: RSS Foundation — Conference Identity
        url: "https://roboticsconference.org/committees/foundation/"
      - label: RSS 2026 — Call for Papers
        url: "https://roboticsconference.org/2026/information/cfp/"
      - label: RSS 2026 — Accepted Papers and HRI Session
        url: "https://roboticsconference.org/2026/program/papers/"
      - label: RSS 2026 — Official Review Guidelines
        url: "https://docs.google.com/document/d/1iinlZAhQ4_DrYyLZAQRG4FE5vYTnoJR_EvgjcpQmcig/edit?usp=sharing"

  - slug: corl
    order: 8
    group: conference
    badge: CoRL
    name: CoRL
    full_name: Conference on Robot Learning
    meta: Selective Single Track · Robotics × Machine Learning
    accent: "#3b7a60"
    accent_dark: "#275743"
    accent_soft: "#eaf5ef"
    hub_intro: >-
      CoRL을 “ML model을 robot에 적용한 conference”로 이해하면 공식 CFP의 robotics requirement를 놓친다.
      Submission은 core robotics problem을 중심으로 해야 하며, model·algorithm·dataset·benchmark가
      <strong>robot learning에 significant original contribution</strong>을 주어야 한다.
    hub_detail: >-
      HRI와 natural-language·gesture instruction은 공식 topic이다. 그러나 human feedback을 썼다는 사실만으로 fit이 생기지는 않는다.
      Real-robot evidence 또는 convincing transfer가 권장되고, robotics focus가 없는 submission은 review 없이 반환될 수 있다.
    definition: >-
      Robotics와 machine learning의 교차점에서 core robotics problem을 새 learning formulation·algorithm·data·benchmark로 해결하며,
      real-robot experiment 또는 convincing transferable simulation evidence를 권장하는 selective single-track conference
    thesis: >-
      CoRL의 HRI paper에서 human은 중요한 signal일 수 있지만
      <strong>primary claim은 여전히 robot learning의 진전</strong>이어야 한다.
    thesis_note: >-
      Preference, demonstration, correction, language, gesture, intervention을 사용하더라도
      무엇을 더 잘 학습하고 generalize·adapt·align하게 되었는지 robotics 관점에서 보여준다.
    facts:
      - value: Single Track
        label: Robotics–ML intersection의 selective international conference
      - value: Core Robotics
        label: 모든 submission은 robotics problem과 relevance를 명시해야 함
      - value: Real Robot
        label: Real experiment 또는 convincing sim-to-real relevance를 권장
      - value: HRI in Scope
        label: HRI · natural language · gesture · alternative instruction devices
    identity:
      - title: Primary knowledge unit
        text: >-
          Robot policy, representation, data, world model, learning algorithm, benchmark 또는 safety·alignment method가
          human signal을 통해 더 잘 learn·generalize·adapt하는 original robotics contribution을 만든다.
      - title: Reviewer가 먼저 보는 것
        text: >-
          Significance와 novelty, experiment 또는 analysis로 claim이 객관적으로 성립하는지,
          scientific·technological impact와 robot-learning relevance를 본다.
          Generic ML improvement나 agent demo만으로는 robot learning contribution을 대신할 수 없다.
    scope:
      - title: Learning from humans
        items:
          - Demonstration and imitation
          - Preference and correction
          - Intervention and shared autonomy
          - Interactive personalization
      - title: Robot instruction
        items:
          - Natural language instruction
          - Gesture and multimodal command
          - Foundation-model grounding
          - Human–robot teaching
      - title: Learning systems
        items:
          - Reinforcement and offline learning
          - World model and representation
          - Safety · alignment · uncertainty
          - Dataset · benchmark · evaluation
    rule:
      label: CoRL의 기본 단위
      text: >-
        <strong>Human input을 통해 robot이 무엇을 새로 학습하고 어디까지 generalize하는가</strong>가 중심이다.
        Explanation이 trust를 높였다는 결과만 남는다면 HRI·CHI가 더 직접적이다.
    position:
      - label: Primary claim
        text: Core robotics problem에 대한 significant original robot-learning contribution.
      - label: Core audience
        text: Robot learning, embodied AI, reinforcement·imitation learning and robotics-system researcher.
      - label: Evidence
        text: Learning curve, baseline, ablation, generalization, data analysis, simulation transfer and real robot.
      - label: Robotics lens
        text: Method·dataset·benchmark가 왜 robotics에 중요한지 명시하고 physical constraints를 반영하는가.
      - label: Strong signal
        text: Human feedback가 learning formulation과 generalization의 핵심 변수다.
      - label: Weak signal
        text: LLM·ML을 연결했지만 policy learning, data, adaptation 또는 robot relevance가 없다.
    neighbors: >-
      RSS는 learning을 포함하되 broader robotics science/systems contribution을 받고, ICRA·IROS는 technical robotics 전 영역을 다룬다.
      HRI·CHI는 human response와 interaction knowledge가 primary result일 때 더 자연스럽다.
    boundary: >-
      CoRL topic list에 HRI가 있다는 것은 모든 HRI+ML paper가 맞는다는 뜻이 아니다.
      Core robotics problem, learning novelty, robot relevance와 claim에 맞는 evidence가 함께 보여야 한다.
    snapshot:
      - value: Official scope
        label: Significant original research at robotics–machine learning intersection
      - value: Typical evidence
        label: Baseline · ablation · generalization · real robot or convincing transfer
      - value: Strong fit
        label: Human signal이 central한 novel robot-learning method or data
      - value: Recheck fit
        label: Trust·UX result only or generic ML with nominal robot demo
    position_note: >-
      CoRL 2026은 Limitations section을 요구하고, accepted paper와 그 review를 decision 후 공개·de-anonymize한다.
      Real-robot experiment를 강제하지는 않지만 real-robot experiment 또는 convincing transferable simulation evidence를 제시하도록 권장한다.
    taste_intro: >-
      좋은 CoRL HRI paper는 <strong>사람의 demonstration·preference·correction을 learning algorithm의 장식이 아니라 problem formulation의 핵심</strong>으로 만든다.
    matrix:
      - axis: Problem
        sound: Human data로 robot policy를 학습
        shaped: 기존 learning이 어떤 human signal·physical constraint·generalization gap을 다루지 못하는지 정의
      - axis: Claim
        sound: Success rate가 향상
        shaped: New learning formulation·algorithm·dataset·benchmark와 generalization consequence를 명시
      - axis: Evidence
        sound: 한 task의 simulation curve
        shaped: Strong baseline·ablation·data efficiency·generalization·real robot or transfer evidence
      - axis: Framing
        sound: LLM·human feedback를 사용
        shaped: Core robotics problem과 learning contribution이 title·abstract 첫 문장에 보임
    framing:
      diffuse:
        sample: “사용자가 자연어로 robot을 수정하면 task 성공률이 높아졌다.”
        explain: Interaction은 보이지만 learning formulation과 generalization contribution이 아직 약하다.
      shaped:
        sample: “Sparse natural-language correction을 preference posterior와 policy update에 통합해 unseen manipulation task로 personalization을 transfer한다.”
        explain: Human correction, learning method, data efficiency, robot generalization이 하나의 claim이 된다.
    lessons:
      - title: Core robotics problem을 먼저 쓴다
        text: Human feedback나 foundation model보다 manipulation·navigation·control problem이 앞에 온다.
      - title: Learning contribution을 명사로 쓴다
        text: Formulation, algorithm, dataset, benchmark, representation 중 무엇이 original한지 명시한다.
      - title: Generalization을 좁게 검증하지 않는다
        text: New task, object, person, environment, embodiment 중 claim한 축을 실제로 시험한다.
      - title: Real-robot relevance를 설득한다
        text: Simulation이라면 sensor noise, dynamics, data collection, transfer assumption을 연결한다.
      - title: HRI outcome과 learning result를 분리한다
        text: Trust·preference finding이 primary라면 venue framing 자체를 다시 검토한다.
    submit:
      big: Robot learning
      small: Human signal로 무엇을 새로 learn·adapt·generalize하는가?
      items:
        - <b>Problem:</b> core robotics task and constraint
        - <b>Contribution:</b> method · data · benchmark · representation
        - <b>Evidence:</b> baseline · ablation · generalization · robot
        - <b>Limits:</b> mandatory limitations and transfer boundary
    final:
      big: >-
        가장 간결하게 말하면, <strong>CoRL의 HRI는 사람을 learning signal로 삼아 robot learning 자체를 전진시키는 research</strong>다.
      small: >-
        좋은 paper는 human feedback을 사용했다는 사실보다, 그 feedback으로 어떤 learning problem을 새로 풀고 physical robot에 무엇이 남는지 선명하다.
    spectrum_intro: >-
      아래 질문은 CoRL 2026 CFP의 HRI·instruction·safety·foundation-model topic을 robot-learning unit으로 바꾼 편집 예시다.
    hero_question:
      tag: Correction learning
      title: Few-shot human correction으로 robot policy를 personalize하고 unseen task에 transfer할 수 있는가?
      text: Human input이 learning formulation, data efficiency, personalization, generalization으로 이어지는 질문.
    questions:
      - tag: Demonstration
        title: Suboptimal human demonstration에서 reusable skill structure를 학습할 수 있는가?
        text: Imitation, representation, robustness를 다루는 질문.
      - tag: Preference
        title: 적은 비교 feedback으로 reward와 uncertainty를 함께 추정할 수 있는가?
        text: Active preference learning과 safe policy update 질문.
      - tag: Language
        title: Natural-language instruction을 grounded robot policy로 안정적으로 변환할 수 있는가?
        text: Foundation model, grounding, action generation 질문.
      - tag: Intervention
        title: Human intervention을 failure label이 아니라 online learning signal로 쓸 수 있는가?
        text: Shared autonomy, correction, continual learning 질문.
      - tag: Alignment
        title: Human intent와 learned reward가 어긋날 때 robot은 어떻게 감지·복구하는가?
        text: Safety, reward misspecification, interactive repair 질문.
      - tag: Benchmark
        title: Human-centered robot learning을 재현 가능하게 비교할 dataset과 metric은 무엇인가?
        text: Data collection, benchmark design, embodiment relevance 질문.
    selection_note: >-
