<section class="visitor-summary" aria-label="공개 방문자 통계">
  <div class="visitor-summary__heading">
    <span>방문자</span>
    <a href="{{ '/visitors/' | relative_url }}">날짜별 보기 <span aria-hidden="true">→</span></a>
  </div>
  <dl class="visitor-metrics">
    <div><dt>지금 방문 중 <small>최근 5분</small></dt><dd><strong data-visitor-value="active">—</strong><span>명</span></dd></div>
    <div><dt>오늘</dt><dd><strong data-visitor-value="today">—</strong><span>명</span></dd></div>
    <div><dt>어제</dt><dd><strong data-visitor-value="yesterday">—</strong><span data-visitor-yesterday-unit>명</span></dd></div>
  </dl>
  <p class="visitor-status" data-visitor-status role="status">방문자 수를 불러오는 중입니다.</p>
  <noscript><p class="visitor-status">방문자 수를 보려면 JavaScript를 켜 주세요.</p></noscript>
</section>
