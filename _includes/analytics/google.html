<!-- Google Analytics: loaded by head.html only in production. -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.id | uri_escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }

  gtag('js', new Date());
  gtag('config', {{ site.analytics.google.id | jsonify }}, {
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
</script>
